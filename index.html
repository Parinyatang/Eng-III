  questions: [
    /* ===== VOCABULARY — from the pack ===== */
    { id: "v1", sec: "vocab", unit: "3A", topic: "ability", src: "pack", q: "Nora has a real ___ for turning old clothes into stylish bags.", th: "นอร่ามี ___ อย่างแท้จริงในการเปลี่ยนเสื้อผ้าเก่าให้เป็นกระเป๋าที่มีสไตล์", c: ["talent", "talented", "skilled", "successful"], a: 0, why: "หลัง a real ต้องเป็นคำนาม และ talent for + noun/-ing = พรสวรรค์ด้าน…", clue: "a real + คำนาม", trap: "talented เป็นคำคุณศัพท์ จึงวางในตำแหน่งคำนามไม่ได้" },
    { id: "v2", sec: "vocab", unit: "3A", topic: "ability", src: "pack", q: "The jewellery maker is highly ___ at repairing delicate watches.", th: "ช่างเครื่องประดับมีความ ___ สูงในการซ่อมนาฬิกาที่ละเอียดอ่อน", c: ["potential", "success", "skilled", "brilliance"], a: 2, why: "skilled at + -ing = มีทักษะจากการฝึกฝน", clue: "มี at repairing ตามหลังช่องว่าง", trap: "potential เป็นคำนาม ใช้กับ is highly ___ at ไม่ได้" },
    { id: "v3", sec: "vocab", unit: "3A", topic: "ability", src: "pack", q: "The community theatre has the ___ to attract larger audiences next year.", th: "โรงละครชุมชนมี ___ ที่จะดึงดูดผู้ชมได้มากขึ้นในปีหน้า", c: ["talent", "successful", "outstanding", "potential"], a: 3, why: "have the potential to + V1 = มีศักยภาพที่จะ…", clue: "the ___ to attract", trap: "talent ใช้รูป talent for ไม่ใช่ the talent to" },
    { id: "v4", sec: "vocab", unit: "3B", topic: "sport", src: "pack", q: "The new café quickly became a serious ___ for older shops in the area.", th: "คาเฟ่ใหม่กลายเป็น ___ ที่สำคัญของร้านเดิมในพื้นที่อย่างรวดเร็ว", c: ["technique", "competitor", "champion", "training"], a: 1, why: "competitor = คู่แข่ง (คนหรือธุรกิจที่แข่งกับอีกฝ่าย)", clue: "ร้านใหม่เป็นคู่แข่งของร้านเดิม", trap: "champion = ผู้ชนะ/แชมป์ ไม่ใช่คู่แข่ง" },
    { id: "v5", sec: "vocab", unit: "3B", topic: "sport", src: "pack", q: "The dancers gave an impressive ___ at the cultural festival.", th: "นักเต้นแสดง ___ ที่น่าประทับใจในเทศกาลวัฒนธรรม", c: ["perform", "professional", "performer", "performance"], a: 3, why: "หลัง an impressive ต้องเป็นคำนามที่หมายถึงการแสดง", clue: "an impressive + noun", trap: "perform = กริยา • performer = คน" },
    { id: "v6", sec: "vocab", unit: "3B", topic: "sport", src: "pack", q: "After months of practice, the swimmer changed her breathing ___ and became more efficient.", th: "หลังฝึกหลายเดือน นักว่ายน้ำเปลี่ยน ___ การหายใจและทำได้มีประสิทธิภาพขึ้น", c: ["technique", "opposition", "champion", "athlete"], a: 0, why: "technique = วิธีเฉพาะที่ใช้ทักษะในการทำสิ่งหนึ่ง", clue: "breathing technique", trap: "opposition = ฝ่าย/ทีมที่เราแข่งด้วย" },
    { id: "v7", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "A software bug ___ several customers to receive the same email twice.", th: "ข้อผิดพลาดของซอฟต์แวร์ ___ ให้ลูกค้าหลายคนได้รับอีเมลฉบับเดิมสองครั้ง", c: ["as a result of", "caused", "was caused by", "effect"], a: 1, why: "ประโยคเริ่มด้วยสาเหตุ → CAUSE → RESULT ใช้ cause เป็นกริยา", clue: "a software bug = สาเหตุ", trap: "was caused by ต้องเริ่มจากผลลัพธ์ก่อน" },
    { id: "v8", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "The cancelled ferry service ___ hundreds of passengers changing their plans.", th: "การยกเลิกเรือโดยสาร ___ ให้ผู้โดยสารหลายร้อยคนต้องเปลี่ยนแผน", c: ["resulted in", "was caused by", "affected by", "as a result of"], a: 0, why: "result in + noun/-ing = ส่งผลให้เกิด (สาเหตุ → ผล)", clue: "การยกเลิก = สาเหตุ, ผู้โดยสารเปลี่ยนแผน = ผล", trap: "as a result of ต้องวางผลไว้หน้า" },
    { id: "v9", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "The damage to the garden was ___ strong winds during the night.", th: "ความเสียหายของสวน ___ ลมแรงในตอนกลางคืน", c: ["result in", "lead to", "caused by", "affect"], a: 2, why: "ประโยคเริ่มด้วยผล → RESULT ← CAUSE ใช้ be caused by", clue: "the damage = ผลลัพธ์", trap: "lead to / result in ใช้ทิศทางตรงข้าม" },
    { id: "v10", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "The new quiet zone has had a positive ___ on the library atmosphere.", th: "พื้นที่เงียบใหม่มี ___ เชิงบวกต่อบรรยากาศในห้องสมุด", c: ["affect", "result in", "cause", "effect"], a: 3, why: "โครงสร้างตายตัว: have a positive effect on + คำนาม", clue: "a positive + คำนาม + on", trap: "affect เป็นกริยา จึงตามหลัง a positive ไม่ได้" },
    { id: "v11", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "The laboratory uses a ___ safety procedure with several careful checks before each experiment.", th: "ห้องปฏิบัติการใช้ขั้นตอนความปลอดภัยที่ ___ โดยมีการตรวจอย่างละเอียดหลายครั้ง", c: ["rigorous", "tricky", "exhausting", "backbreaking"], a: 0, why: "rigorous = ละเอียด เข้มข้น มาตรฐานสูง", clue: "several careful checks + detailed procedure", trap: "strict เน้นกฎ • exhausting/backbreaking เน้นความเหนื่อยหรือแรงกาย" },
    { id: "v12", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "Carrying furniture up six flights of stairs was ___ work.", th: "การขนเฟอร์นิเจอร์ขึ้นบันไดหกชั้นเป็นงานที่ ___", c: ["strict", "demanding", "backbreaking", "tricky"], a: 2, why: "backbreaking ใช้กับงานที่หนักมากทางร่างกายโดยเฉพาะ", clue: "carrying furniture up six flights", trap: "demanding กว้างกว่า • tricky = ซับซ้อนต้องระวัง" },
    { id: "v13", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "The final week of rehearsals was so ___ that the cast needed two days to recover.", th: "สัปดาห์สุดท้ายของการซ้อม ___ มากจนทีมนักแสดงต้องพักฟื้นสองวัน", c: ["strict", "grueling", "tricky", "rigorous"], a: 1, why: "grueling = เหนื่อยและหนักหน่วงต่อเนื่องเป็นเวลานาน", clue: "needed two days to recover", trap: "rigorous เน้นมาตรฐานสูง ไม่ได้เน้นความเหนื่อย" },
    { id: "v14", sec: "vocab", unit: "3A", topic: "ability", src: "pack", q: "Mira is naturally ___ at designing small spaces, even though she has never studied interior design.", th: "มิร่ามีความ ___ โดยธรรมชาติในการออกแบบพื้นที่ขนาดเล็ก แม้ไม่เคยเรียนออกแบบภายใน", c: ["successful", "strict", "talented", "professional"], a: 2, why: "talented at + -ing = เก่งโดยธรรมชาติ", clue: "naturally + at designing", trap: "professional = เกี่ยวกับงานอาชีพ ไม่ใช่ความสามารถโดยธรรมชาติ" },
    { id: "v15", sec: "vocab", unit: "3A", topic: "ability", src: "pack", q: "The community garden has the ___ to become a popular weekend attraction.", th: "สวนชุมชนมี ___ ที่จะกลายเป็นสถานที่ยอดนิยมในวันหยุด", c: ["potential", "opposition", "technique", "champion"], a: 0, why: "potential to + V1 = ศักยภาพที่จะพัฒนา/สำเร็จในอนาคต", clue: "to become ตามหลังช่องว่าง", trap: "คำนามอื่นไม่เข้ากับรูป has the ___ to become" },
    { id: "v16", sec: "vocab", unit: "3B", topic: "sport", src: "pack", q: "The small coffee shop opened next to a strong ___ that already had many loyal customers.", th: "ร้านกาแฟเล็กเปิดติดกับ ___ ที่แข็งแกร่งซึ่งมีลูกค้าประจำจำนวนมากอยู่แล้ว", c: ["athlete", "training", "champion", "competitor"], a: 3, why: "competitor = คู่แข่งทางธุรกิจ", clue: "ร้านที่มีลูกค้าประจำอยู่แล้ว = คู่แข่ง", trap: "champion = ผู้ชนะ ไม่ใช่คู่แข่งทางธุรกิจ" },
    { id: "v17", sec: "vocab", unit: "3B", topic: "sport", src: "pack", q: "The violinist gave an excellent ___ at the charity concert.", th: "นักไวโอลินแสดง ___ ได้ยอดเยี่ยมในคอนเสิร์ตการกุศล", c: ["professional", "performance", "perform", "performer"], a: 1, why: "หลัง an excellent ต้องเป็นคำนาม = performance", clue: "an excellent + noun", trap: "perform = กริยา • performer = คน" },
    { id: "v18", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "A lack of clear signs can ___ confusion among first-time visitors.", th: "การไม่มีป้ายที่ชัดเจนอาจ ___ ความสับสนให้ผู้มาเยือนครั้งแรก", c: ["be caused by", "lead to", "as a result of", "effect"], a: 1, why: "CAUSE มาก่อน → lead to + ผลลัพธ์", clue: "lack of clear signs = สาเหตุ, confusion = ผล", trap: "be caused by กลับทิศเป็น Result ← Cause" },
    { id: "v19", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "The unexpected delay was ___ a technical problem in the ticketing system.", th: "ความล่าช้าที่ไม่คาดคิด ___ ปัญหาทางเทคนิคในระบบออกตั๋ว", c: ["resulted in", "affected", "caused by", "lead to"], a: 2, why: "RESULT มาก่อน → be caused by + สาเหตุ", clue: "delay = ผล, technical problem = สาเหตุ", trap: "resulted in ต้องวางสาเหตุไว้หน้า" },
    { id: "v20", sec: "vocab", unit: "4A", topic: "cause", src: "pack", q: "The new lighting had a positive ___ on the atmosphere of the restaurant.", th: "แสงแบบใหม่มี ___ เชิงบวกต่อบรรยากาศของร้านอาหาร", c: ["effect", "affect", "result", "cause"], a: 0, why: "have a positive effect on ต้องใช้คำนาม effect", clue: "positive + noun + on", trap: "affect เป็นกริยา ทำหน้าที่คำนามตรงนี้ไม่ได้" },
    { id: "v21", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "The astronaut candidates went through a ___ selection process with detailed medical and psychological tests.", th: "ผู้สมัครนักบินอวกาศผ่านกระบวนการคัดเลือกที่ ___ ซึ่งมีการตรวจร่างกายและจิตวิทยาอย่างละเอียด", c: ["tough", "exhausting", "strict", "rigorous"], a: 3, why: "rigorous = กระบวนการละเอียด เข้มข้น มาตรฐานสูง", clue: "detailed medical and psychological tests", trap: "strict เน้นการทำตามกฎ • exhausting เน้นความเหนื่อย" },
    { id: "v22", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "Installing the tiny electronic parts was ___ because one wrong connection could damage the device.", th: "การติดตั้งชิ้นส่วนอิเล็กทรอนิกส์ขนาดเล็กเป็นเรื่อง ___ เพราะต่อผิดเพียงจุดเดียวอาจทำให้อุปกรณ์เสีย", c: ["arduous", "punishing", "strict", "tricky"], a: 3, why: "tricky = ยากเพราะต้องใช้ความระมัดระวังและทักษะ", clue: "one wrong connection could damage the device", trap: "arduous เน้นงานที่ใช้แรง/เวลานาน • strict เน้นกฎ" },
    { id: "v23", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "Digging the drainage channel by hand was ___ work.", th: "การขุดร่องระบายน้ำด้วยมือเป็นงานที่ ___", c: ["rigorous", "backbreaking", "tricky", "strict"], a: 1, why: "backbreaking = งานหนักมากทางร่างกาย", clue: "digging by hand", trap: "tricky เน้นความซับซ้อน ไม่ใช่งานหนักทางกาย" },
    { id: "v24", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "The actors completed a ___ twelve-hour rehearsal with almost no breaks.", th: "นักแสดงซ้อมต่อเนื่อง 12 ชั่วโมงแบบ ___ แทบไม่มีเวลาพัก", c: ["strict", "tough", "grueling", "talented"], a: 2, why: "grueling = เหนื่อยและยากอย่างต่อเนื่องเป็นเวลานาน", clue: "twelve hours + almost no breaks", trap: "strict เน้นกฎและวินัย ไม่ได้เน้นความเหนื่อยล้า" },
    { id: "v25", sec: "vocab", unit: "4B", topic: "difficulty", src: "pack", q: "The museum has ___ rules about touching objects in the historical collection.", th: "พิพิธภัณฑ์มีกฎที่ ___ เรื่องการสัมผัสวัตถุในคอลเลกชันประวัติศาสตร์", c: ["strict", "exhausting", "arduous", "backbreaking"], a: 0, why: "strict = เข้มงวด ต้องทำตามกฎอย่างเคร่งครัด", clue: "rules about touching", trap: "ตัวเลือกอื่นเน้นความพยายามหรือความเหนื่อย ไม่ใช่การควบคุมด้วยกฎ" },

    /* ===== VOCABULARY — extra practice ===== */
    { id: "v26", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "Although she never took a course, Dao is clearly ___ at drawing faces.", th: "แม้ไม่เคยเรียนคอร์สไหน ดาวก็ ___ ในการวาดใบหน้าอย่างชัดเจน", c: ["skilled", "talented", "successful", "strict"], a: 1, why: "never took a course = ความสามารถโดยธรรมชาติ → talented at + -ing", clue: "never took a course", trap: "skilled เน้นทักษะที่เกิดจากการเรียน/ฝึก ซึ่งขัดกับบริบท" },
    { id: "v27", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "After years of practice, the team is highly ___ in restoring damaged photographs.", th: "หลังฝึกมาหลายปี ทีมงานมีความ ___ สูงในการซ่อมภาพถ่ายที่เสียหาย", c: ["talented", "skilled", "potential", "able"], a: 1, why: "skilled at/in + noun/-ing = ทักษะที่พัฒนาจากการฝึก", clue: "After years of practice", trap: "talented เน้นพรสวรรค์โดยธรรมชาติ ไม่ใช่ทักษะจากการฝึก" },
    { id: "v28", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "A good receptionist needs the ___ to stay polite under pressure.", th: "พนักงานต้อนรับที่ดีต้องมี ___ ที่จะสุภาพได้แม้อยู่ภายใต้ความกดดัน", c: ["ability", "able", "talented", "brilliance"], a: 0, why: "ability to + V1 = ความสามารถที่จะ…", clue: "the ___ to stay", trap: "able เป็นคำคุณศัพท์ (be able to) จึงใช้หลัง the ไม่ได้" },
    { id: "v29", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "The volunteers were ___ in collecting winter clothes for 300 families.", th: "อาสาสมัคร ___ ในการรวบรวมเสื้อผ้ากันหนาวให้ 300 ครอบครัว", c: ["successful", "talented", "potential", "exceptional"], a: 0, why: "successful in + -ing = สำเร็จตามเป้าหมายที่ตั้งไว้", clue: "เน้นผลสำเร็จที่ทำได้จริง", trap: "talented/exceptional พูดถึงระดับความสามารถ ไม่ใช่ผลที่สำเร็จ" },
    { id: "v30", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "The judges praised the ___ of her recycled-paper design.", th: "กรรมการชื่นชม ___ ของงานออกแบบกระดาษรีไซเคิลของเธอ", c: ["brilliant", "brilliance", "able", "skilled"], a: 1, why: "หลัง the ต้องเป็นคำนาม → brilliance", clue: "the ___ of her design", trap: "brilliant เป็นคำคุณศัพท์" },
    { id: "v31", sec: "vocab", unit: "3B", topic: "sport", src: "extra", q: "The club lost to strong ___ in the semi-final.", th: "สโมสรแพ้ให้กับ ___ ที่แข็งแกร่งในรอบรองชนะเลิศ", c: ["competitor", "opposition", "referee", "spectator"], a: 1, why: "opposition = ฝ่ายตรงข้ามโดยรวมที่เราแข่งด้วย", clue: "lost to strong ___", trap: "competitor เน้นผู้แข่งขันรายหนึ่ง • referee = ผู้ตัดสิน" },
    { id: "v32", sec: "vocab", unit: "3B", topic: "sport", src: "extra", q: "New staff receive two weeks of ___ before they start.", th: "พนักงานใหม่ได้รับ ___ สองสัปดาห์ก่อนเริ่มงาน", c: ["training", "technique", "trainer", "train"], a: 0, why: "training = กระบวนการฝึกฝน (คำนาม)", clue: "two weeks of + คำนาม", trap: "trainer = คนฝึก • technique = วิธีการเฉพาะ" },
    { id: "v33", sec: "vocab", unit: "3B", topic: "sport", src: "extra", q: "The runner ___ better in cool weather than in the afternoon heat.", th: "นักวิ่งคนนี้ ___ ได้ดีกว่าในอากาศเย็นเมื่อเทียบกับช่วงบ่ายที่ร้อน", c: ["performance", "performer", "performs", "professional"], a: 2, why: "ตำแหน่งนี้ต้องเป็นกริยา → performs", clue: "The runner ___ better", trap: "performance เป็นคำนาม • performer เป็นคำนามบุคคล" },
    { id: "v34", sec: "vocab", unit: "3B", topic: "sport", src: "extra", q: "She hopes to turn ___ after winning three junior titles.", th: "เธอหวังจะผันตัวเป็น ___ หลังคว้าแชมป์รุ่นเยาวชนสามรายการ", c: ["profession", "professional", "performance", "competition"], a: 1, why: "professional ใช้เป็นคำนามหมายถึงผู้ที่ทำกิจกรรมนั้นเป็นอาชีพ", clue: "turn professional = ผันตัวเป็นมืออาชีพ", trap: "profession = อาชีพ (ตัวอาชีพ ไม่ใช่ตัวบุคคล)" },
    { id: "v35", sec: "vocab", unit: "4A", topic: "cause", src: "extra", q: "Heavy rain ___ the delay of three flights on Sunday evening.", th: "ฝนตกหนัก ___ ความล่าช้าของเที่ยวบินสามเที่ยวในเย็นวันอาทิตย์", c: ["caused", "was caused by", "as a result of", "effect"], a: 0, why: "เริ่มด้วยสาเหตุ (heavy rain) → cause + ผลลัพธ์", clue: "ฝนตกหนัก = สาเหตุ", trap: "was caused by ต้องเริ่มจากผลลัพธ์" },
    { id: "v36", sec: "vocab", unit: "4A", topic: "cause", src: "extra", q: "Many outdoor events were cancelled ___ the flood warning.", th: "กิจกรรมกลางแจ้งหลายงานถูกยกเลิก ___ ประกาศเตือนน้ำท่วม", c: ["led to", "as a result of", "resulted in", "caused"], a: 1, why: "ประโยคเริ่มด้วยผล → as a result of + สาเหตุ (noun/-ing)", clue: "events were cancelled = ผล", trap: "led to / resulted in ใช้ทิศทาง Cause → Result" },
    { id: "v37", sec: "vocab", unit: "4A", topic: "cause", src: "extra", q: "Too much screen time before bed can ___ sleep quality.", th: "การใช้หน้าจอมากเกินไปก่อนนอนอาจ ___ คุณภาพการนอน", c: ["affect", "effect", "as a result of", "caused by"], a: 0, why: "ตำแหน่งหลัง can ต้องเป็นกริยา → affect + กรรม", clue: "can + V1", trap: "effect เป็นคำนาม (have an effect on)" },
    { id: "v38", sec: "vocab", unit: "4A", topic: "cause", src: "extra", q: "Switching to online forms ___ fewer mistakes in applications.", th: "การเปลี่ยนมาใช้แบบฟอร์มออนไลน์ ___ ข้อผิดพลาดในใบสมัครน้อยลง", c: ["was caused by", "resulted in", "as a result of", "effect"], a: 1, why: "result in + noun = ส่งผลให้เกิด (สาเหตุมาก่อน)", clue: "switching = สาเหตุ, fewer mistakes = ผล", trap: "as a result of ต้องตามด้วยสาเหตุ ไม่ใช่ผล" },
    { id: "v39", sec: "vocab", unit: "4B", topic: "difficulty", src: "extra", q: "The three-day hike through the mountains was ___ but the views were worth it.", th: "การเดินป่าในภูเขาสามวัน ___ แต่วิวก็คุ้มค่า", c: ["tricky", "arduous", "strict", "rigorous"], a: 1, why: "arduous = ยากลำบาก ต้องใช้แรงและความพยายามมาก", clue: "three-day hike through the mountains", trap: "tricky เน้นความต้องระวัง/ซับซ้อน ไม่ใช่การใช้แรง" },
    { id: "v40", sec: "vocab", unit: "4B", topic: "difficulty", src: "extra", q: "Working two shifts during the festival was ___; I slept for ten hours afterwards.", th: "การทำงานสองกะช่วงเทศกาล ___ มาก ฉันนอนไปสิบชั่วโมงหลังจากนั้น", c: ["tricky", "exhausting", "strict", "rigorous"], a: 1, why: "exhausting = ทำให้เหนื่อยมาก", clue: "slept for ten hours afterwards", trap: "rigorous เน้นมาตรฐานของกระบวนการ ไม่ใช่ความเหนื่อย" },
    { id: "v41", sec: "vocab", unit: "4B", topic: "difficulty", src: "extra", q: "Looking after four children and studying at night is a ___ routine.", th: "การดูแลลูกสี่คนพร้อมเรียนตอนกลางคืนเป็นกิจวัตรที่ ___", c: ["demanding", "tricky", "strict", "backbreaking"], a: 0, why: "demanding = ต้องใช้เวลา ความพยายามและความใส่ใจมาก", clue: "ทำหลายบทบาทพร้อมกัน", trap: "backbreaking เน้นงานหนักทางร่างกายโดยเฉพาะ" },
    { id: "v42", sec: "vocab", unit: "4B", topic: "difficulty", src: "extra", q: "Choosing between two good job offers was a ___ decision.", th: "การเลือกระหว่างข้อเสนองานดี ๆ สองที่เป็นการตัดสินใจที่ ___", c: ["tough", "backbreaking", "rigorous", "strict"], a: 0, why: "tough decision = ยากต่อการตัดสินใจทั้งทางความคิดและความรู้สึก", clue: "คำนามคู่กันคือ decision", trap: "backbreaking ใช้กับงานที่ใช้แรงกายเท่านั้น" },
    { id: "v43", sec: "vocab", unit: "4B", topic: "difficulty", src: "extra", q: "The cyclists faced a ___ schedule of 21 stages in 23 days.", th: "นักปั่นต้องเจอตารางที่ ___ คือ 21 สเตจใน 23 วัน", c: ["punishing", "tricky", "strict", "rigorous"], a: 0, why: "punishing schedule = ตารางที่หนักและรุนแรงมาก", clue: "21 stages in 23 days", trap: "rigorous เน้นความละเอียดของกระบวนการ ไม่ใช่ความหนักของตาราง" },
    { id: "v44", sec: "vocab", unit: "3B", topic: "sport", src: "extra", q: "After the final whistle, the young team became the national ___.", th: "หลังเสียงนกหวีดหมดเวลา ทีมเยาวชนกลายเป็น ___ ระดับประเทศ", c: ["championship", "champion", "competitor", "opposition"], a: 1, why: "champion = ผู้ชนะ/แชมป์ (ตัวบุคคลหรือทีม)", clue: "became the national ___", trap: "championship = การแข่งขันชิงแชมป์ (won the championship)" },
    { id: "v45", sec: "vocab", unit: "3A", topic: "ability", src: "extra", q: "This small bakery has the ___ to grow into a national brand.", th: "ร้านเบเกอรีเล็ก ๆ นี้มี ___ ที่จะเติบโตเป็นแบรนด์ระดับประเทศ", c: ["potential", "talent", "skill", "success"], a: 0, why: "potential to + V1 = ศักยภาพในอนาคต", clue: "the ___ to grow", trap: "talent ใช้ talent for และเน้นความสามารถที่มีอยู่แล้ว" },

    /* ===== GRAMMAR — from the pack ===== */
    { id: "g1", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "After the perfume bottle was removed, the strong smell slowly ___.", th: "หลังจากนำขวดน้ำหอมออกไป กลิ่นแรงก็ค่อย ๆ ___", c: ["went away", "looked after", "made up", "fell out with"], a: 0, why: "go away = หายไป เป็น Type 1 จบได้โดยไม่ต้องมีกรรม", clue: "the strong smell slowly ___", trap: "look after / make up / fall out with ความหมายและโครงสร้างไม่ตรง" },
    { id: "g2", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "I installed the new budgeting app and ___ for a week before deciding to keep it.", th: "ฉันติดตั้งแอปจัดงบใหม่และ ___ หนึ่งสัปดาห์ก่อนตัดสินใจใช้ต่อ", c: ["tried out it", "tried it out", "looked it into", "went it away"], a: 1, why: "try sth out = ทดลองใช้ เป็น Type 2 แยกได้ pronoun ต้องอยู่กลาง", clue: "before deciding to keep it", trap: "tried out it วาง pronoun ผิดตำแหน่ง" },
    { id: "g3", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The podcast ___ how small towns are reducing food waste.", th: "พอดแคสต์นี้ ___ ว่าเมืองเล็ก ๆ กำลังลดขยะอาหารอย่างไร", c: ["believes in", "looks after", "focuses on", "runs out of"], a: 2, why: "focus on = มุ่งเน้น เป็น Type 3 ห้ามแยก", clue: "พอดแคสต์ “เน้น” หัวข้อ", trap: "believe in = เชื่อมั่นใน • look after = ดูแล" },
    { id: "g4", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The printer stopped because we had ___ ink.", th: "เครื่องพิมพ์หยุดทำงานเพราะเรา ___ หมึก", c: ["looked down on", "made up", "picked up", "run out of"], a: 3, why: "run out of = ใช้หมด เป็น Type 4 ต้องจำทั้งสามส่วน", clue: "หมึกหมดจึงหยุดพิมพ์", trap: "ตัวเลือกอื่นไม่ได้แปลว่า “หมด”" },
    { id: "g5", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "These batteries can be recycled, so do not ___.", th: "แบตเตอรี่เหล่านี้รีไซเคิลได้ ดังนั้นอย่า ___", c: ["throw away them", "throw them away", "go away them", "look them after"], a: 1, why: "throw sth away เป็น Type 2 เมื่อกรรมเป็น pronoun ต้องอยู่กลาง", clue: "them = แบตเตอรี่", trap: "throw away them ผิดตำแหน่ง pronoun" },
    { id: "g6", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The design team ___ a clever way to reuse old event banners.", th: "ทีมออกแบบ ___ วิธีฉลาด ๆ ในการนำป้ายงานเก่ากลับมาใช้ซ้ำ", c: ["looked down on", "went on about", "fell out with", "came up with"], a: 3, why: "come up with = คิดไอเดีย/วิธีแก้ขึ้นมา (Type 4 + กรรม)", clue: "a clever way = ไอเดีย/วิธีแก้", trap: "go on about = พูดซ้ำ • fall out with = ผิดใจกัน" },
    { id: "g7", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "My roommate is really ___ street photography.", th: "รูมเมตของฉันสนใจการถ่ายภาพสตรีท ___ มาก", c: ["into", "on", "after", "of"], a: 0, why: "be into + noun = ชอบ/สนใจมาก", clue: "street photography คือสิ่งที่สนใจ", trap: "be on / after / of ไม่ใช่รูปเป้าหมายในบทนี้" },
    { id: "g8", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The flight attendant managed to ___ the nervous child ___.", th: "พนักงานต้อนรับสามารถ ___ เด็กที่กังวลให้ ___ ได้", c: ["take / off", "wake / up", "calm / down", "let / down"], a: 2, why: "calm sb down = ทำให้ใครสงบลง เป็น Type 2 กรรมอยู่กลาง", clue: "เด็กกังวล จึงต้องทำให้สงบ", trap: "let down = ทำให้ผิดหวัง • wake up = ปลุก" },
    { id: "g9", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "Could you ___ my houseplants while I am away for the weekend?", th: "ช่วย ___ ต้นไม้ในบ้านให้หน่อยได้ไหมตอนที่ฉันไม่อยู่", c: ["go on about", "look after", "run out of", "make up"], a: 1, why: "look after = ดูแล เป็น Type 3 verb + particle ติดกันแล้วตามด้วยกรรม", clue: "ต้นไม้ต้องมีคนดูแลตอนเจ้าของไม่อยู่", trap: "run out of = ของหมด ไม่ได้แปลว่าดูแล" },
    { id: "g10", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The singer promised not to ___ her fans ___ by cancelling the show without a reason.", th: "นักร้องสัญญาว่าจะไม่ ___ แฟน ๆ ___ ด้วยการยกเลิกการแสดงโดยไม่มีเหตุผล", c: ["look / into", "wake / up", "take / off", "let / down"], a: 3, why: "let sb down = ทำให้ผิดหวัง เป็น Type 2 กรรมแทรกกลาง", clue: "แฟน ๆ คือคนที่จะผิดหวัง", trap: "wake up / take off ความหมายคนละอย่าง" },
    { id: "g11", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "My uncle can ___ vintage cameras for hours; he never gets bored of the topic.", th: "ลุงของฉัน ___ เรื่องกล้องวินเทจได้นานหลายชั่วโมงและไม่เคยเบื่อ", c: ["go on about", "look down on", "fall out with", "get away with"], a: 0, why: "go on about = พูดเรื่องเดิมซ้ำ ๆ ไม่หยุด", clue: "for hours + never gets bored", trap: "fall out with = ทะเลาะ • get away with = ทำผิดแล้วไม่ถูกลงโทษ" },
    { id: "g12", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "My phone battery is low because I ___ videos for almost three hours.", th: "แบตโทรศัพท์ใกล้หมดเพราะฉัน ___ วิดีโอมาเกือบสามชั่วโมง", c: ["have edited five", "edited yesterday", "have been editing", "am edited"], a: 2, why: "เน้นกิจกรรมที่ทำต่อเนื่องและผลที่เห็นตอนนี้ → Present Perfect Continuous", clue: "for almost three hours + ผลปัจจุบัน", trap: "have edited five เน้นจำนวนที่เสร็จแล้ว ไม่ใช่ระยะเวลา" },
    { id: "g13", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "We ___ this apartment since 2023.", th: "เรา ___ อพาร์ตเมนต์นี้มาตั้งแต่ปี 2023", c: ["have been owning", "have owned", "owned since", "are owning"], a: 1, why: "own เป็น state verb จึงใช้ Present Perfect กับ since", clue: "state verb + since", trap: "have been owning ไม่ใช่รูปปกติของ state verb" },
    { id: "g14", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "Which sentence correctly asks about a completed number this semester?", th: "ประโยคใดถามถึง “จำนวนที่ทำเสร็จแล้ว” ในภาคเรียนนี้ได้ถูกต้อง", c: ["How many online courses have you completed this semester?", "How many courses have you been completing how many?", "How many courses did you complete since January?", "How many courses are you completed?"], a: 0, why: "How many เน้นจำนวนที่เสร็จแล้ว → Present Perfect", clue: "How many = จำนวน/ผลลัพธ์", trap: "ตัวเลือกอื่นผิด tense หรือเรียงคำผิด" },
    { id: "g15", sec: "grammar", unit: "4A", topic: "usedto", src: "pack", q: "When I was a child, our family ___ near the river, but we moved years ago.", th: "ตอนฉันเป็นเด็ก ครอบครัวเรา ___ ใกล้แม่น้ำ แต่ย้ายออกไปหลายปีแล้ว", c: ["used to live", "would live", "was used to live", "used living"], a: 0, why: "used to ใช้กับสภาวะในอดีตที่ปัจจุบันไม่เป็นแบบนั้นแล้ว", clue: "live near the river = สภาวะ/ภูมิหลัง", trap: "would live ไม่ใช้กับสภาวะทั่วไปในอดีต" },
    { id: "g16", sec: "grammar", unit: "4A", topic: "usedto", src: "pack", q: "Every December, my grandmother ___ handmade cards to all her friends.", th: "ทุกเดือนธันวาคม คุณยายของฉัน ___ การ์ดทำมือให้เพื่อนทุกคนเป็นประจำ", c: ["used to be sending", "would send", "would know", "was used to send"], a: 1, why: "Every December = การกระทำซ้ำในอดีต → would + V1", clue: "คำบอกความถี่ + action", trap: "would know เป็น state verb จึงไม่เข้ากับความหมายนี้" },
    { id: "g17", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "You ___ share your password with anyone. It is prohibited.", th: "คุณ ___ แชร์รหัสผ่านให้ใคร เพราะเป็นสิ่งต้องห้าม", c: ["do not have to", "are allowed to", "should", "must not"], a: 3, why: "must not = ห้ามทำ (prohibition)", clue: "It is prohibited", trap: "do not have to = ไม่จำเป็น ไม่ใช่ห้าม" },
    { id: "g18", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "Guests ___ bring towels; the hotel provides them.", th: "แขก ___ นำผ้าเช็ดตัวมา เพราะโรงแรมมีให้", c: ["do not have to", "must not", "were not allowed to", "had to"], a: 0, why: "โรงแรมมีให้ จึงไม่จำเป็นต้องนำมา → don't have to", clue: "the hotel provides them", trap: "must not จะกลายเป็น “ห้ามนำผ้าเช็ดตัวมา”" },
    { id: "g19", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "Last year, visitors ___ enter the archive without a staff member.", th: "ปีที่แล้ว ผู้เยี่ยมชม ___ เข้าเขตเอกสารเก่าโดยไม่มีเจ้าหน้าที่", c: ["do not need to", "were not allowed to", "must", "are supposed to"], a: 1, why: "อดีต + ไม่ได้รับอนุญาต → were not allowed to", clue: "Last year", trap: "รูปปัจจุบันไม่สอดคล้องกับคำบอกเวลาในอดีต" },
    { id: "g20", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "I still cannot ___ why the smart lock keeps disconnecting.", th: "ฉันยัง ___ ไม่ได้ว่าทำไมสมาร์ตล็อกหลุดการเชื่อมต่อซ้ำ ๆ", c: ["figure out", "figure it out of", "look it into", "come with up"], a: 0, why: "figure sth out = เข้าใจ/หาคำตอบ (Type 2)", clue: "cannot ___ why = เข้าใจ/แก้ปัญหา", trap: "figure it out of เติม particle เกินมา" },
    { id: "g21", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "The delivery company is ___ why two parcels were sent to the same address.", th: "บริษัทขนส่งกำลัง ___ ว่าทำไมพัสดุสองชิ้นถูกส่งไปที่อยู่เดียวกัน", c: ["looking it into", "looking up to", "looking into", "looking into it of"], a: 2, why: "look into = ตรวจสอบ เป็น Type 3 ห้ามแยก", clue: "บริษัทกำลังสอบสวนสาเหตุ", trap: "looking it into แยก Type 3 ซึ่งผิด" },
    { id: "g22", sec: "grammar", unit: "3A", topic: "mwv", src: "pack", q: "He thought he could ___ using another person's parking permit, but security noticed.", th: "เขาคิดว่าจะ ___ การใช้บัตรจอดรถของคนอื่นโดยไม่ถูกลงโทษ แต่ รปภ. เห็น", c: ["look after", "go on about", "fall out with", "get away with"], a: 3, why: "get away with + noun/-ing = ทำผิดแล้วไม่ถูกลงโทษ", clue: "using another person's permit + security noticed", trap: "fall out with = ทะเลาะ/ผิดใจกับใคร" },
    { id: "g23", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "I ___ three independent films this month, so I can recommend one.", th: "เดือนนี้ฉัน ___ หนังอิสระไปสามเรื่องแล้ว จึงแนะนำได้", c: ["have been watching three", "have watched", "have been watched", "am watching since"], a: 1, why: "three films = จำนวนที่เสร็จแล้วในช่วงเวลาที่ยังไม่จบ → Present Perfect", clue: "three + this month", trap: "Continuous จะเน้นกิจกรรม/ระยะเวลา ไม่ใช่จำนวน" },
    { id: "g24", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "Her hands are covered in clay because she ___ pottery all afternoon.", th: "มือของเธอเปื้อนดินเหนียวเพราะเธอ ___ งานปั้นมาตลอดบ่าย", c: ["has made yesterday", "makes since noon", "has been making", "has been made"], a: 2, why: "กิจกรรมต่อเนื่องที่อธิบายผลที่เห็นตอนนี้ → Present Perfect Continuous", clue: "all afternoon + visible result", trap: "has made จะเน้นสิ่งที่ทำเสร็จ ไม่ใช่กิจกรรมต่อเนื่อง" },
    { id: "g25", sec: "grammar", unit: "3B", topic: "perfect", src: "pack", q: "I ___ this bicycle since my first year at university.", th: "ฉัน ___ จักรยานคันนี้มาตั้งแต่ปีหนึ่ง", c: ["have owned", "have been owning", "owned since", "am owning"], a: 0, why: "own เป็น state verb ใช้ Present Perfect กับ since", clue: "since my first year + state verb", trap: "have been owning ไม่ใช่รูปเป้าหมาย" },
    { id: "g26", sec: "grammar", unit: "4A", topic: "usedto", src: "pack", q: "When my aunt was young, she ___ a tiny bookshop near the station.", th: "ตอนคุณป้ายังสาว เธอ ___ ร้านหนังสือเล็ก ๆ ใกล้สถานี", c: ["would own as a state", "used to own", "used owning", "would be own"], a: 1, why: "own a bookshop = สภาวะในอดีต → used to + V1", clue: "own = state verb", trap: "would own ไม่ใช้กับสภาวะทั่วไปในอดีต" },
    { id: "g27", sec: "grammar", unit: "4A", topic: "usedto", src: "pack", q: "Every rainy season, my grandfather ___ the roof before the storms arrived.", th: "ทุกฤดูฝน คุณตาของฉัน ___ หลังคาก่อนพายุมาเป็นประจำ", c: ["would be knowing", "used to being", "was used to repair", "would repair"], a: 3, why: "Every rainy season = การกระทำซ้ำในอดีต → would + V1", clue: "คำบอกความถี่ + action", trap: "ตัวเลือกอื่นผิดโครงสร้างหรือใช้ would กับ state verb" },
    { id: "g28", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "Visitors ___ cross the safety barrier. It is prohibited.", th: "ผู้เยี่ยมชม ___ ข้ามแนวกั้นความปลอดภัย เพราะเป็นสิ่งต้องห้าม", c: ["do not have to", "need not", "must not", "are supposed to"], a: 2, why: "must not = ห้าม", clue: "It is prohibited", trap: "do not have to / need not = ไม่จำเป็น ไม่ใช่ห้าม" },
    { id: "g29", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "You ___ print the ticket; the QR code on your phone is accepted.", th: "คุณ ___ พิมพ์ตั๋ว เพราะใช้ QR code ในโทรศัพท์ได้", c: ["do not have to", "must not", "were not allowed to", "had to"], a: 0, why: "มีทางเลือกอื่นให้ใช้ จึงไม่จำเป็นต้องทำ", clue: "alternative provided → no obligation", trap: "must not จะหมายถึง “ห้ามพิมพ์”" },
    { id: "g30", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "The sudden announcement ___ everyone check the departure screen again.", th: "ประกาศกะทันหัน ___ ให้ทุกคนตรวจจอเที่ยวบินอีกครั้ง", c: ["let to", "made", "was allowed", "made to"], a: 1, why: "make + object + V1 (ไม่มี to): made everyone check", clue: "บังคับ/ทำให้ทุกคนต้องตรวจ", trap: "made to ผิดในโครงสร้าง active" },
    { id: "g31", sec: "grammar", unit: "4B", topic: "obligation", src: "pack", q: "After the orientation, new members ___ use the makerspace equipment with a supervisor.", th: "หลังปฐมนิเทศ สมาชิกใหม่ ___ ใช้อุปกรณ์ makerspace โดยมีผู้ดูแลได้", c: ["had to prohibit", "must not", "were not allowed to", "were allowed to"], a: 3, why: "อดีต + ได้รับอนุญาต → were allowed to + V1", clue: "หลังปฐมนิเทศจึงได้รับอนุญาต", trap: "were not allowed to ให้ความหมายตรงข้าม" },

    /* ===== GRAMMAR — extra practice ===== */
    { id: "g32", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "The baby finally ___ after the music stopped.", th: "ในที่สุดทารกก็ ___ หลังเพลงหยุด", c: ["calmed down", "calmed it down", "let down", "came up with"], a: 0, why: "calm down แบบไม่มีกรรม = สงบลงเอง (Type 1)", clue: "ไม่มีกรรมตามหลัง ประโยคจบได้", trap: "calmed it down ต้องมีกรรมที่อ้างถึงชัดเจน" },
    { id: "g33", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "Here is the receipt — please do not ___.", th: "นี่คือใบเสร็จ อย่า ___ นะ", c: ["throw away it", "throw it away", "throw away them", "go away it"], a: 1, why: "throw sth away เป็น Type 2 • pronoun it ต้องอยู่กลาง", clue: "it = ใบเสร็จ (เอกพจน์)", trap: "throw away it ผิดตำแหน่ง • them ไม่ตรงกับ receipt เอกพจน์" },
    { id: "g34", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "The investors ___ the young designer's idea from the start.", th: "นักลงทุน ___ ไอเดียของนักออกแบบรุ่นใหม่มาตั้งแต่ต้น", c: ["believed in", "believed it in", "looked down", "ran out"], a: 0, why: "believe in = เชื่อมั่นใน เป็น Type 3 ห้ามแยก", clue: "มีกรรมตามหลังทันที", trap: "believed it in แยกวลี Type 3 ซึ่งผิด" },
    { id: "g35", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "We had to stop baking because we ___ flour.", th: "เราต้องหยุดอบเพราะเรา ___ แป้ง", c: ["ran out of", "ran out", "ran it out of", "came up with"], a: 0, why: "run out of + กรรม = ใช้หมด (Type 4 ต้องมีกรรมตามหลัง)", clue: "มีกรรม flour ตามหลัง", trap: "ran out ไม่มี of จึงรับกรรมไม่ได้" },
    { id: "g36", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "The students really ___ their old swimming coach, who still helps them for free.", th: "นักเรียน ___ โค้ชว่ายน้ำคนเก่ามาก เพราะเขายังช่วยสอนฟรีอยู่", c: ["look up to", "look down on", "go on about", "fall out with"], a: 0, why: "look up to = ชื่นชมและนับถือ", clue: "โค้ชยังช่วยสอนฟรี = น่านับถือ", trap: "look down on = ดูถูก ซึ่งตรงข้าม" },
    { id: "g37", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "He ___ his business partner over money, and they no longer speak.", th: "เขา ___ หุ้นส่วนธุรกิจเรื่องเงิน และตอนนี้ไม่คุยกันแล้ว", c: ["fell out with", "looked into", "picked up", "tried out"], a: 0, why: "fall out with = ทะเลาะจนผิดใจกัน (Type 4)", clue: "they no longer speak", trap: "look into = ตรวจสอบ ไม่ใช่ทะเลาะ" },
    { id: "g38", sec: "grammar", unit: "3A", topic: "mwv", src: "extra", q: "The teacher asked the class to stop ___ the same question.", th: "ครูขอให้นักเรียนเลิก ___ คำถามเดิมซ้ำ ๆ", c: ["going on about", "going it on about", "getting away with", "looking after"], a: 0, why: "go on about = พูดเรื่องเดิมซ้ำ ๆ มากเกินไป", clue: "the same question ซ้ำ ๆ", trap: "going it on about แทรกกรรมใน Type 4 ซึ่งห้ามทำ" },
    { id: "g39", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "She ___ this song three times today.", th: "วันนี้เธอ ___ เพลงนี้ไปสามรอบแล้ว", c: ["has played", "has been playing", "is playing", "has been played"], a: 0, why: "three times = จำนวนที่เสร็จแล้ว → Present Perfect", clue: "three times today", trap: "has been playing เน้นกิจกรรมต่อเนื่อง ไม่ใช่จำนวนรอบ" },
    { id: "g40", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "My eyes hurt because I ___ at a screen since nine o'clock.", th: "ตาฉันปวดเพราะฉัน ___ จอมาตั้งแต่เก้าโมง", c: ["have looked", "have been looking", "look", "am looking"], a: 1, why: "กิจกรรมต่อเนื่องที่อธิบายผลตอนนี้ (ตาปวด) → Perfect Continuous", clue: "since nine o'clock + visible result", trap: "have looked เน้นผลที่เสร็จแล้ว ไม่ใช่กิจกรรมต่อเนื่อง" },
    { id: "g41", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "How long ___ for the bus?", th: "คุณรอรถเมล์มานานแค่ไหนแล้ว", c: ["have you been waiting", "did you wait", "are you waiting", "have you been waited"], a: 0, why: "How long เน้นระยะเวลาของกิจกรรมที่ยังดำเนินอยู่", clue: "How long = ระยะเวลา", trap: "did you wait เป็นอดีตที่จบแล้ว ไม่เชื่อมกับปัจจุบัน" },
    { id: "g42", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "We ___ each other since primary school.", th: "เรา ___ กันมาตั้งแต่ประถม", c: ["have known", "have been knowing", "knew since", "are knowing"], a: 0, why: "know เป็น state verb → Present Perfect", clue: "state verb + since", trap: "have been knowing ไม่ใช้ในความหมายนี้" },
    { id: "g43", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "They ___ the road outside our building all week, so it is very noisy.", th: "พวกเขา ___ ถนนหน้าตึกมาตลอดทั้งสัปดาห์ เลยเสียงดังมาก", c: ["have repaired", "have been repairing", "repair", "have been repaired"], a: 1, why: "all week + ผลปัจจุบัน (เสียงดัง) → Perfect Continuous", clue: "all week", trap: "have repaired จะสื่อว่าซ่อมเสร็จแล้ว" },
    { id: "g44", sec: "grammar", unit: "3B", topic: "perfect", src: "extra", q: "The café ___ its menu twice this year.", th: "ร้านกาแฟ ___ เมนูไปสองครั้งในปีนี้", c: ["has changed", "has been changing", "changed yet", "is changed"], a: 0, why: "twice = จำนวนครั้งที่เสร็จแล้วในช่วงเวลาที่ยังไม่จบ", clue: "twice this year", trap: "has been changing เน้นกิจกรรมต่อเนื่อง ไม่ใช่จำนวนครั้ง" },
    { id: "g45", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "I ___ coffee, but now I drink it every morning.", th: "ฉัน ___ ชอบกาแฟ แต่ตอนนี้ดื่มทุกเช้า", c: ["did not use to like", "did not used to like", "would not like", "was not used to like"], a: 0, why: "หลัง did/didn't ใช้ use (ไม่เติม -d)", clue: "didn't use to + V1", trap: "didn't used to เป็นรูปที่ผิดตามบทเรียน" },
    { id: "g46", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "___ your family ___ to live in Khon Kaen?", th: "ครอบครัวของคุณ ___ อยู่ที่ขอนแก่นใช่ไหม", c: ["Did / use", "Did / used", "Do / used", "Was / used"], a: 0, why: "คำถาม: Did + S + use to + V1", clue: "หลัง Did ใช้ use", trap: "Did / used เติม -d หลัง did ซึ่งผิด" },
    { id: "g47", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "Every Songkran, my cousins ___ to our house with buckets of water.", th: "ทุกสงกรานต์ ลูกพี่ลูกน้อง ___ มาที่บ้านเราพร้อมถังน้ำ", c: ["would come", "would be coming", "used to coming", "were used to come"], a: 0, why: "Every Songkran = การกระทำซ้ำในอดีต → would + V1", clue: "คำบอกความถี่ในอดีต", trap: "used to coming / were used to come ผิดรูป" },
    { id: "g48", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "This building ___ a cinema before it became a bookshop.", th: "อาคารนี้ ___ โรงหนังก่อนจะกลายเป็นร้านหนังสือ", c: ["used to be", "would be", "is used to be", "used being"], a: 0, why: "be = state verb → used to be", clue: "สภาวะในอดีตที่เปลี่ยนไปแล้ว", trap: "would be ไม่ใช้กับสภาวะทั่วไปในอดีต" },
    { id: "g49", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "I have moved to the night shift, and I am slowly ___ sleeping in the afternoon.", th: "ฉันย้ายไปทำกะกลางคืน และกำลังค่อย ๆ ___ การนอนตอนบ่าย", c: ["getting used to", "used to", "would", "use to"], a: 0, why: "get used to + noun/-ing = กำลังปรับตัวให้คุ้นเคย", clue: "slowly + กำลังปรับตัว", trap: "used to + V1 = เคยทำในอดีต คนละความหมาย" },
    { id: "g50", sec: "grammar", unit: "4A", topic: "usedto", src: "extra", q: "My grandparents ___ letters any more; they use video calls.", th: "ปู่ย่าของฉัน ___ เขียนจดหมายแล้ว พวกท่านใช้วิดีโอคอล", c: ["do not write", "no longer write", "are not writing", "did not write"], a: 0, why: "any more ใช้คู่กับกริยาปฏิเสธ และมักอยู่ท้ายประโยค", clue: "มี any more ท้ายประโยค", trap: "no longer write ... any more ซ้ำซ้อน (เลือกอย่างใดอย่างหนึ่ง)" },
    { id: "g51", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "Students ___ use dictionaries during the exam; the rule is printed on the cover.", th: "นักเรียน ___ ใช้พจนานุกรมระหว่างสอบ กฎระบุไว้บนปก", c: ["are not allowed to", "do not have to", "should", "need not"], a: 0, why: "เป็นกฎห้าม → not allowed to", clue: "the rule is printed on the cover", trap: "do not have to = ไม่จำเป็น ซึ่งไม่ใช่การห้าม" },
    { id: "g52", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "You ___ wear a helmet on this site. It is a safety rule.", th: "คุณ ___ สวมหมวกนิรภัยในพื้นที่นี้ เป็นกฎความปลอดภัย", c: ["have to", "do not have to", "are allowed to", "need not"], a: 0, why: "กฎจากภายนอก = ความจำเป็น → have to + V1", clue: "It is a safety rule", trap: "are allowed to = อนุญาต ไม่ใช่บังคับ" },
    { id: "g53", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "We ___ queue for an hour because the staff opened a second counter.", th: "เรา ___ ต่อแถวเป็นชั่วโมง เพราะเจ้าหน้าที่เปิดเคาน์เตอร์ที่สอง", c: ["did not have to", "must not", "were not allowed to", "had to"], a: 0, why: "อดีต + ไม่จำเป็นต้องทำ → didn't have to", clue: "เปิดเคาน์เตอร์เพิ่ม จึงไม่ต้องรอนาน", trap: "were not allowed to = ไม่ได้รับอนุญาต คนละความหมาย" },
    { id: "g54", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "Last term, we ___ eat in the computer room.", th: "เทอมที่แล้ว เรา ___ กินอาหารในห้องคอมพิวเตอร์", c: ["were not allowed to", "are not allowed to", "do not have to", "must not"], a: 0, why: "Last term = อดีต + ไม่อนุญาต → were not allowed to", clue: "คำบอกเวลาอดีต", trap: "are not allowed to เป็นรูปปัจจุบัน" },
    { id: "g55", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "The security guard ___ us show our ID cards.", th: "เจ้าหน้าที่รักษาความปลอดภัย ___ ให้เราแสดงบัตรประจำตัว", c: ["made", "made to", "let to", "allowed"], a: 0, why: "make + object + V1 (ไม่มี to)", clue: "us show (V1 ไม่มี to)", trap: "allowed ต้องตามด้วย to show" },
    { id: "g56", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "My parents ___ me choose my own university.", th: "พ่อแม่ ___ ให้ฉันเลือกมหาวิทยาลัยเอง", c: ["let", "let to", "allowed to", "made to"], a: 0, why: "let + object + V1 (ไม่มี to)", clue: "me choose (V1 ไม่มี to)", trap: "let to choose ผิดรูป" },
    { id: "g57", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "Everyone ___ leave the building during the fire drill.", th: "ทุกคน ___ ออกจากอาคารระหว่างซ้อมหนีไฟ", c: ["was forced to", "was forced", "forced to", "made to"], a: 0, why: "passive: be forced to + V1 (มี to)", clue: "Everyone เป็นผู้ถูกกระทำ", trap: "was forced ขาด to • made to ไม่ใช่รูป passive ที่ถูกต้องตรงนี้" },
    { id: "g58", sec: "grammar", unit: "4B", topic: "obligation", src: "extra", q: "You ___ submit the form today; the deadline is Friday.", th: "คุณ ___ ส่งแบบฟอร์มวันนี้ เพราะกำหนดส่งคือวันศุกร์", c: ["do not have to", "must not", "are not allowed to", "had to"], a: 0, why: "ยังมีเวลาถึงศุกร์ = ไม่จำเป็นต้องทำวันนี้", clue: "the deadline is Friday", trap: "must not จะกลายเป็น “ห้ามส่งวันนี้”" },

    /* ===== READING — seen passages ===== */
    { id: "r1", sec: "reading", unit: "3A", topic: "r-learning", src: "pack", q: "Text B suggests that linking a new password to a vivid image can help because it creates ___.", th: "บทอ่าน B บอกว่าการเชื่อมรหัสผ่านใหม่กับภาพที่ชัดเจนช่วยได้ เพราะทำให้เกิด ___", c: ["physical strength", "a time-of-day rhythm", "an association", "natural talent"], a: 2, why: "Text B อธิบายว่าการเชื่อมข้อมูลใหม่กับภาพชัดเจนสร้าง association ซึ่งช่วยความจำ", clue: "ภาพใหม่เชื่อมกับสิ่งที่รู้ = association", trap: "physical strength และ body rhythm เป็นแนวคิดจากส่วนอื่นของบทอ่าน" },
    { id: "r2", sec: "reading", unit: "3A", topic: "r-learning", src: "pack", q: "Why does Text C include different amounts of practice time?", th: "ทำไมบทอ่าน C จึงกล่าวถึงจำนวนชั่วโมงฝึกที่แตกต่างกัน", c: ["to prove mornings are best", "to support the idea that practice contributes to high achievement", "to show memory techniques are unnecessary", "to compare sports and music"], a: 1, why: "ตัวเลขชั่วโมงถูกใช้เป็นหลักฐานสนับสนุนบทบาทของการฝึก", clue: "ตัวเลขเป็นหลักฐาน ไม่ใช่รายละเอียดลอย ๆ", trap: "บทอ่านไม่ได้บอกว่าตอนเช้าดีที่สุด และไม่ได้เทียบกีฬากับดนตรีตรงนี้" },
    { id: "r3", sec: "reading", unit: "3A", topic: "r-learning", src: "extra", q: "According to Text A, why is late morning often suggested for brain-heavy work?", th: "ตามบทอ่าน A ทำไมช่วงสายจึงเหมาะกับงานที่ใช้สมอง", c: ["because strength and coordination peak then", "because many people concentrate well around 10 a.m. to midday", "because memory only works in the morning", "because practice replaces talent"], a: 1, why: "บทอ่านระบุว่าหลายคนมีสมาธิดีช่วงราว 10 น.–เที่ยง ส่วนช่วงบ่ายเหมาะกับกิจกรรมทางกาย", clue: "เวลา → สภาพร่างกาย/สมอง → กิจกรรมที่เหมาะ", trap: "ความแข็งแรงและการประสานงานเป็นช่วงบ่าย ไม่ใช่ช่วงสาย" },
    { id: "r4", sec: "reading", unit: "3A", topic: "r-learning", src: "extra", q: "Which conclusion about Text C is best supported by the passage?", th: "ข้อสรุปใดเกี่ยวกับบทอ่าน C ที่มีหลักฐานรองรับมากที่สุด", c: ["Talent never matters.", "Anyone who practises 10,000 hours becomes a champion.", "Practice contributes strongly to high achievement.", "Natural ability alone guarantees success."], a: 2, why: "บทอ่านตั้งคำถามกับพรสวรรค์อย่างเดียวและเน้นว่าการฝึกมีบทบาทสำคัญ", clue: "เลือกข้อสรุปที่พอดีกับหลักฐาน", trap: "never / anyone / guarantees เป็นคำเด็ดขาดเกินหลักฐาน" },
    { id: "r5", sec: "reading", unit: "3B", topic: "r-born", src: "pack", q: "Which profile connects a lower centre of gravity with balance and dribbling?", th: "โปรไฟล์ใดเชื่อม “จุดศูนย์ถ่วงต่ำ” กับการทรงตัวและการเลี้ยงบอล", c: ["Kalenjin runners", "Nate Robinson", "Eero Mäntyranta", "Christian Pulisic"], a: 3, why: "โปรไฟล์ Pulisic เชื่อมตัวที่เตี้ยกว่า/จุดศูนย์ถ่วงต่ำ กับการทรงตัวและเลี้ยงบอล", clue: "lower centre of gravity เป็นคำใบ้เฉพาะของ Pulisic", trap: "โปรไฟล์อื่นเน้นเม็ดเลือดแดง ลักษณะขา หรือช่วงแขน" },
    { id: "r6", sec: "reading", unit: "3B", topic: "r-born", src: "pack", q: "What do the four profiles mainly illustrate?", th: "โปรไฟล์ทั้งสี่แสดงแนวคิดหลักข้อใด", c: ["Every champion succeeds because of luck.", "Only training matters.", "Different physical or learned factors can contribute to performance.", "Short athletes always perform better."], a: 2, why: "ทั้งสี่เรื่องมีปัจจัยต่างกัน แต่เชื่อมกับผลงานระดับสูงเหมือนกัน", clue: "ปัจจัยต่างกัน → performance", trap: "ตัวเลือกที่ใช้ always/only เด็ดขาดเกินหลักฐาน" },
    { id: "r7", sec: "reading", unit: "3B", topic: "r-born", src: "extra", q: "Which detail belongs to Eero Mäntyranta?", th: "รายละเอียดใดเป็นของ Eero Mäntyranta", c: ["an arm span longer than his height", "a gene linked to an unusually high level of red blood cells", "thin legs and ankles", "a lower centre of gravity"], a: 1, why: "บทอ่านเชื่อมยีนหายากกับเม็ดเลือดแดงที่มากผิดปกติและผลงานที่ดีมาก", clue: "ยีน → เม็ดเลือดแดง → 7 เหรียญโอลิมปิก", trap: "ช่วงแขนเป็นของ Nate Robinson • ลักษณะขาเป็นของนักวิ่ง Kalenjin" },
    { id: "r8", sec: "reading", unit: "3B", topic: "r-born", src: "extra", q: "Nate Robinson's profile mainly shows that ___.", th: "โปรไฟล์ของ Nate Robinson แสดงให้เห็นว่า ___", c: ["height is the only factor in basketball", "a disadvantage in one area can be balanced by another physical advantage", "training is unnecessary in basketball", "luck decides sports performance"], a: 1, why: "สูงราว 1.75 ม. แต่ช่วงแขนราว 1.85 ม. ทำให้เอื้อมได้ไกลกว่าที่คาด", clue: "เปรียบเทียบส่วนสูงกับช่วงแขน", trap: "บทอ่านไม่ได้บอกว่าการฝึกไม่จำเป็นหรือโชคเป็นตัวตัดสิน" },
    { id: "r9", sec: "reading", unit: "4A", topic: "r-life", src: "pack", q: "Why is the cookery competition important in Mark's story?", th: "ทำไมการแข่งขันทำอาหารจึงสำคัญในเรื่องของ Mark", c: ["It explains his childhood poverty.", "It shows he disliked food.", "It helped move his path toward London and later opportunities.", "It caused him to leave school at 16."], a: 2, why: "การแข่งขันทำหน้าที่เป็นจุดเปลี่ยนที่พาเขาไปลอนดอนและสู่โอกาสต่อมา", clue: "ถาม “ทำไมสำคัญ” ต้องตอบผลต่อเส้นทางชีวิต", trap: "การออกจากโรงเรียนตอน 16 เกิดขึ้นก่อนการแข่งขัน" },
    { id: "r10", sec: "reading", unit: "4A", topic: "r-life", src: "pack", q: "What do Rupesh and Mark's stories mainly show?", th: "เรื่องของ Rupesh และ Mark แสดงแนวคิดหลักข้อใด", c: ["Success comes only from luck.", "Money is always the main source of happiness.", "Formal education guarantees wealth.", "Opportunities and decisions can change a person's path."], a: 3, why: "ทั้งสองเรื่องเดินตามโครงสร้าง before → turning point → now", clue: "ใจความร่วม = จุดเปลี่ยน + การตัดสินใจ + ผล", trap: "only luck / guarantees wealth เป็นข้อสรุปเกินหลักฐาน" },
    { id: "r11", sec: "reading", unit: "4A", topic: "r-life", src: "extra", q: "Which event is the turning point in Rupesh's story?", th: "เหตุการณ์ใดเป็นจุดเปลี่ยนในเรื่องของ Rupesh", c: ["winning a cookery competition", "selling his motorbike and buying a single ticket to London", "finding his grandmother's discount vouchers", "leaving school at 16"], a: 1, why: "เขาขายมอเตอร์ไซค์ได้ £600 แล้วเดินทางไปลอนดอน ซึ่งเปิดเส้นทางใหม่", clue: "motorbike → single ticket → London", trap: "การแข่งขันทำอาหารและคูปองส่วนลดเป็นเรื่องของ Mark" },
    { id: "r12", sec: "reading", unit: "4A", topic: "r-life", src: "extra", q: "Which detail shows the result of Mark Pearson's online business idea?", th: "รายละเอียดใดแสดงผลลัพธ์ของไอเดียธุรกิจออนไลน์ของ Mark", c: ["He left school at 16.", "He went to catering college.", "He sold his company for £55 million.", "He grew up in Liverpool."], a: 2, why: "การขายบริษัทได้ £55 ล้านคือผลลัพธ์ ส่วนตัวเลือกอื่นเป็นภูมิหลัง", clue: "แยก “ภูมิหลัง” ออกจาก “ผลลัพธ์”", trap: "ภูมิหลังเกิดก่อนจุดเปลี่ยน จึงไม่ใช่ผลของไอเดียธุรกิจ" },
    { id: "r13", sec: "reading", unit: "4B", topic: "r-emergency", src: "pack", q: "In Passage A, why is risk assessment important?", th: "ในบทอ่าน A ทำไมการประเมินความเสี่ยงจึงสำคัญ", c: ["because Joe works as a programmer", "because volunteers choose only easy routes", "because rescue situations can change quickly and require decisions", "because it replaces physical fitness"], a: 2, why: "การประเมินความเสี่ยงช่วยให้ตัดสินใจเร็วและปลอดภัยในสถานการณ์ที่เปลี่ยนไว", clue: "risk assessment เชื่อมกับความปลอดภัยและการตัดสินใจ", trap: "บทอ่านระบุว่าต้องใช้ทั้งร่างกายและการตัดสินใจ ไม่ใช่แทนที่กัน" },
    { id: "r14", sec: "reading", unit: "4B", topic: "r-emergency", src: "pack", q: "What do Joe and Amelia have in common?", th: "Joe และ Amelia มีสิ่งใดเหมือนกัน", c: ["Both work only outdoors.", "Both rely mainly on machines.", "Both avoid difficult situations.", "Both need training and must make responsible decisions under pressure."], a: 3, why: "บริบทต่างกัน แต่ทั้งคู่ต้องฝึก ตัดสินใจเร็ว และรับผิดชอบต่อความปลอดภัย/ชีวิต", clue: "คำถามเปรียบเทียบต้องหาสิ่งที่จริงทั้งสองฝ่าย", trap: "Amelia ทำงานในโรงพยาบาล ไม่ได้ทำงานกลางแจ้ง" },
    { id: "r15", sec: "reading", unit: "4B", topic: "r-emergency", src: "extra", q: "According to Passage A, how long does the main rescue training course take?", th: "ตามบทอ่าน A หลักสูตรฝึกกู้ภัยหลักใช้เวลานานเท่าไร", c: ["about two years", "about six months", "about 40 minutes", "about 300 hours in total"], a: 0, why: "บทอ่านระบุหลักสูตรเข้มข้นราวสองปี", clue: "rigorous course; about two years", trap: "300 ชั่วโมงคือการฝึกต่อเนื่องต่อปีหลังจบหลักสูตร • 40 นาทีคือเวลาที่ผู้ประสบเหตุหิมะถล่มอาจรอด" },
    { id: "r16", sec: "reading", unit: "4B", topic: "r-emergency", src: "extra", q: "What does Amelia say is important when an emergency changes suddenly?", th: "Amelia บอกว่าอะไรสำคัญเมื่อสถานการณ์ฉุกเฉินเปลี่ยนกะทันหัน", c: ["working only with machines", "keeping a clear head and trusting professional instincts", "avoiding difficult patients", "choosing quieter shifts"], a: 1, why: "เธอเน้นการคิดให้ชัด เชื่อสัญชาตญาณวิชาชีพ และไม่ให้อารมณ์มารบกวน", clue: "trust instincts, keep a clear head", trap: "บทอ่านไม่ได้พูดถึงการเลี่ยงผู้ป่วยหรือเลือกกะ" },

    /* ===== READING — unseen passages ===== */
    { id: "r17", sec: "reading", unit: "—", topic: "u-library", src: "pack", q: "What is the main purpose of the Library of Things?", th: "จุดประสงค์หลักของ Library of Things คืออะไร", c: ["to sell second-hand tools for profit", "to let residents borrow useful items instead of buying each one", "to teach only professional repair workers", "to store objects that nobody may use"], a: 1, why: "แนวคิดที่ย้ำทั้งบทคือการยืมของใช้แทนการซื้อทุกชิ้น", clue: "ความคิดที่ปรากฏซ้ำตลอดบทอ่าน", trap: "ตัวลวงอื่นเปลี่ยนจุดประสงค์ของโครงการเป็นการขายเครื่องมือ การฝึกเฉพาะมืออาชีพ หรือการเก็บของที่ไม่มีใครใช้" },
    { id: "r18", sec: "reading", unit: "—", topic: "u-library", src: "pack", q: "Why did the project begin?", th: "โครงการนี้เริ่มขึ้นเพราะเหตุใด", c: ["Many useful objects were rarely used, while buying and storing them was costly.", "The town had no public library.", "Local shops stopped selling tools.", "Residents were required by law to share equipment."], a: 0, why: "ย่อหน้าแรกระบุสาเหตุ: ของมีประโยชน์ถูกเก็บไว้ไม่ได้ใช้ และการซื้อ/เก็บมีต้นทุน", clue: "ย้อนไปย่อหน้า 1", trap: "ตัวลวงอื่น (ไม่มีห้องสมุดในเมือง ร้านเลิกขายเครื่องมือ กฎหมายบังคับให้แบ่งปัน) เพิ่มข้อมูลที่บทอ่านไม่ได้ระบุ" },
    { id: "r19", sec: "reading", unit: "—", topic: "u-library", src: "pack", q: "What can reasonably be inferred about convenience?", th: "เราสามารถอนุมานเกี่ยวกับ “ความสะดวก” ได้อย่างไร", c: ["It matters only to volunteers.", "It makes repair impossible.", "It has no effect on borrowing decisions.", "Easy booking and collection can make people more willing to borrow."], a: 3, why: "ย่อหน้าสุดท้ายเชื่อมความสะดวกในการจอง/รับของกับความเต็มใจที่จะยืม", clue: "ถ้าจองยาก คนจะเลือกซื้อแทน", trap: "ตัวลวงที่บอกว่าความสะดวกไม่มีผลต่อการตัดสินใจยืม ขัดกับเหตุผลในย่อหน้าสุดท้ายโดยตรง" },
    { id: "r20", sec: "reading", unit: "—", topic: "u-library", src: "pack", q: "In the final paragraph, \"limited\" is closest in meaning to ___.", th: "ในย่อหน้าสุดท้าย คำว่า limited ใกล้เคียงกับคำใดมากที่สุด", c: ["expensive", "popular", "restricted", "unusual"], a: 2, why: "limited ในบริบทนี้ = ถูกจำกัด มีให้เฉพาะบางช่วงเวลา", clue: "collection times are too limited", trap: "popular และ unusual ไม่สื่อว่าเวลารับของถูกจำกัด" },
    { id: "r21", sec: "reading", unit: "—", topic: "u-lights", src: "pack", q: "What problem did astronomers and wildlife groups identify?", th: "นักดาราศาสตร์และกลุ่มอนุรักษ์สัตว์ระบุปัญหาอะไร", c: ["The village had too few roads.", "The hospital used motion sensors.", "Artificial light affected the night sky and animals.", "Visitors refused to attend astronomy events."], a: 2, why: "ย่อหน้าแรกระบุผลกระทบสองด้านของแสงประดิษฐ์", clue: "ตามหลัง However ในย่อหน้า 1", trap: "ตัวเลือกอื่นเป็นรายละเอียดที่ไม่ใช่ปัญหาที่สองกลุ่มนี้ชี้" },
    { id: "r22", sec: "reading", unit: "—", topic: "u-lights", src: "pack", q: "How did the council respond to safety concerns?", th: "สภาท้องถิ่นตอบสนองต่อความกังวลเรื่องความปลอดภัยอย่างไร", c: ["It returned every streetlight to full brightness.", "It compared police reports from before and after the trial.", "It cancelled the project immediately.", "It asked astronomy visitors to patrol the streets."], a: 1, why: "สภาใช้หลักฐานโดยเทียบรายงานตำรวจก่อนและหลังการทดลอง", clue: "ย่อหน้า 3: compared police reports", trap: "การเปิดไฟเต็มทุกดวงหรือยกเลิกโครงการทันทีเป็นการกลับความหมายแบบสุดโต่ง ส่วนการให้ผู้มาดูดาวช่วยตรวจตราถนนเป็นข้อมูลที่แต่งเพิ่ม" },
    { id: "r23", sec: "reading", unit: "—", topic: "u-lights", src: "pack", q: "Which result was mentioned after one year?", th: "มีการกล่าวถึงผลลัพธ์ใดหลังผ่านไปหนึ่งปี", c: ["Electricity use had fallen.", "Every resident supported the project.", "The hospital became darker after midnight.", "Wildlife completely returned to normal."], a: 0, why: "บทอ่านระบุชัดว่าการใช้ไฟฟ้าลดลงหลังหนึ่งปี", clue: "สแกนหาวลี After one year", trap: "every / completely เป็นคำเด็ดขาดที่บทอ่านไม่ได้สนับสนุน • ไฟใกล้โรงพยาบาลยังสว่างอยู่" },
    { id: "r24", sec: "reading", unit: "—", topic: "u-lights", src: "pack", q: "What is the writer's main message in the final paragraph?", th: "สารหลักของผู้เขียนในย่อหน้าสุดท้ายคืออะไร", c: ["All streetlights should be removed.", "Darkness is always safer than light.", "Tourism is more important than residents.", "Lighting should be used carefully where and when it is needed."], a: 3, why: "ย่อหน้าสุดท้ายเสนอการออกแบบแสงอย่างระมัดระวัง ไม่ใช่ความมืดทั้งหมด", clue: "not that darkness is always better, but…", trap: "การรื้อไฟถนนทั้งหมดและการบอกว่าความมืดปลอดภัยกว่าเสมอสุดโต่งเกินไป ส่วนเรื่องท่องเที่ยวสำคัญกว่าผู้อยู่อาศัยเปลี่ยนประเด็นของผู้เขียน" },
    {"id":"r25","sec":"reading","unit":"—","topic":"u-bike","src":"extra","q":"What problem did the first families want to solve?","th":"ครอบครัวกลุ่มแรกต้องการแก้ปัญหาอะไร","c":["Parents did not think it was safe for a child to ride there alone.","The school had no bicycle parking.","The children did not own bicycles.","The police refused to help."],"a":0,"why":"ย่อหน้าแรกระบุว่าถนนใกล้โรงเรียนรถเยอะเกินกว่าจะให้เด็กปั่นคนเดียว","clue":"ประโยคสุดท้ายของย่อหน้า 1","trap":"ตัวเลือกอื่นเพิ่มข้อมูลที่บทอ่านไม่ได้กล่าวถึง"},
    {"id":"r26","sec":"reading","unit":"—","topic":"u-bike","src":"extra","q":"According to the passage, why do drivers slow down?","th":"ตามบทอ่าน ทำไมคนขับรถจึงชะลอความเร็ว","c":["The city built new cycle lanes.","A big, visible group is hard for drivers to miss.","The police fine drivers every Friday.","The group rides only on quiet streets."],"a":1,"why":"บทอ่านอธิบายว่าขบวนใหญ่และเห็นได้ชัด คนขับจึงชะลอ","clue":"Because the group is large and easy to see","trap":"ตัวลวง “ขี่เฉพาะถนนที่เงียบ” ลอกคำจากบทอ่านมาจริง แต่ไม่ใช่เหตุผลที่คนขับชะลอความเร็ว"},
    { id: "r27", sec: "reading", unit: "—", topic: "u-bike", src: "extra", q: "What does the writer suggest about the effect on pupils?", th: "ผู้เขียนสื่ออะไรเกี่ยวกับผลที่มีต่อนักเรียน", c: ["The project proves that cycling improves exam results.", "Teachers have noticed pupils seem more awake, but this has not been measured carefully.", "Pupils arrive late when they cycle.", "The school has stopped the project."], a: 1, why: "บทอ่านใช้คำว่า seem และระบุว่าโรงเรียนยังไม่ได้วัดผลอย่างจริงจัง", clue: "although the school has not measured this carefully", trap: "proves เป็นคำที่แรงเกินหลักฐานในบทอ่าน" },
    { id: "r28", sec: "reading", unit: "—", topic: "u-bike", src: "extra", q: "In the last paragraph, \"depends on\" is closest in meaning to ___.", th: "ในย่อหน้าสุดท้าย depends on ใกล้เคียงกับคำใดมากที่สุด", c: ["refuses", "relies on", "replaces", "reduces"], a: 1, why: "depend on = ต้องอาศัย/ขึ้นอยู่กับ", clue: "ถ้าไม่มีผู้ใหญ่นำขบวน สัปดาห์นั้นก็ไม่มีขบวน", trap: "replaces และ reduces เปลี่ยนความหมายของประโยคทั้งหมด" },
    { id: "r29", sec: "reading", unit: "—", topic: "u-robot", src: "extra", q: "Why are strawberries difficult to harvest by machine?", th: "ทำไมสตรอว์เบอร์รีจึงเก็บด้วยเครื่องได้ยาก", c: ["They are too heavy for a robot arm.", "They bruise easily, hide under leaves and ripen at different times.", "They grow only at night.", "They must be washed before picking."], a: 1, why: "ย่อหน้าแรกให้เหตุผลสามข้อตรง ๆ", clue: "bruises easily / hides under leaves / ripen a week apart", trap: "ตัวเลือกอื่นเป็นข้อมูลที่บทอ่านไม่ได้ระบุ" },
    { id: "r30", sec: "reading", unit: "—", topic: "u-robot", src: "extra", q: "How does the robot avoid damaging the fruit?", th: "หุ่นยนต์หลีกเลี่ยงการทำให้ผลไม้เสียหายอย่างไร", c: ["It picks only unripe berries.", "It uses a soft gripper that closes gently.", "It works four times faster than a human.", "It washes each berry first."], a: 1, why: "กล้องตรวจสีและขนาด ส่วนมือจับแบบนุ่มหุบอย่างนุ่มนวลเพื่อไม่ให้ผิวเสียหาย", clue: "soft gripper closes gently", trap: "คนเก็บเร็วกว่าหุ่นยนต์ราว 4 เท่า ไม่ใช่กลับกัน" },
    {"id":"r31","sec":"reading","unit":"—","topic":"u-robot","src":"extra","q":"Which statement best matches what the engineers claim?","th":"ข้อใดตรงกับสิ่งที่วิศวกรกล่าวมากที่สุด","c":["The robot will soon replace all human pickers.","The robot works best in tall, uneven rows.","It could save fruit that farms would otherwise lose.","The robot is already faster than human pickers."],"a":2,"why":"วิศวกรไม่ได้สัญญาว่าจะแทนที่คน แต่ชี้ว่าทำงานกลางคืน/สภาพอากาศไม่ดีได้","clue":"are not promising to replace pickers","trap":"บทอ่านระบุว่าเครื่องทำงานได้ไม่ดีในแถวที่สูงและไม่สม่ำเสมอ"},
    { id: "r32", sec: "reading", unit: "—", topic: "u-robot", src: "extra", q: "In the final paragraph, \"admit\" is closest in meaning to ___.", th: "ในย่อหน้าสุดท้าย admit ใกล้เคียงกับคำใดมากที่สุด", c: ["deny", "accept that something is true", "promise", "improve"], a: 1, why: "admit = ยอมรับว่าบางอย่างเป็นความจริง (โดยเฉพาะข้อจำกัด)", clue: "ตามด้วยข้อเสียของเครื่อง", trap: "deny มีความหมายตรงข้ามกับบริบท" }
  ]
};

/* ---------- บทอ่าน unseen ใหม่ 4 บท ---------- */
P.readings.push(
{
  id:"u-fourday", kind:"unseen", unit:"—", title:"The Office That Tried a Four-Day Week", th:"บทอ่านใหม่ — ทดลองทำงาน 4 วันต่อสัปดาห์",
  strategy:"จับเงื่อนไขของการทดลอง เหตุผลของแต่ละการเปลี่ยนแปลง และ “ใครไม่ได้ประโยชน์”",
  paras:[
    {en:"A medium-sized software company in Wellington asked its 120 staff to work four days instead of five for six months. Salaries stayed the same. Managers set one condition: each team had to deliver the same amount of work. Before the trial started, staff were asked to list the meetings and tasks they considered least useful.",
     th:"บริษัทซอฟต์แวร์ขนาดกลางให้พนักงาน 120 คนทำงาน 4 วันแทน 5 วันเป็นเวลา 6 เดือน โดยเงินเดือนเท่าเดิม ผู้บริหารตั้งเงื่อนไขข้อเดียวคือแต่ละทีมต้องส่งงานได้ปริมาณเท่าเดิม ก่อนเริ่มทดลอง พนักงานถูกขอให้ระบุการประชุมและงานที่คิดว่าไร้ประโยชน์ที่สุด"},
    {en:"The changes that followed were mostly small. Long update meetings became short written notes. A shared calendar blocked two mornings a week for focused work, when messages were not expected to be answered quickly. Staff also agreed to keep Wednesday as the free day, so that the office was never closed for two days in a row.",
     th:"การเปลี่ยนแปลงที่ตามมาส่วนใหญ่เป็นเรื่องเล็ก ๆ การประชุมรายงานความคืบหน้าที่ยาวกลายเป็นบันทึกสั้น ๆ ปฏิทินกลางกันเวลาไว้สองเช้าต่อสัปดาห์สำหรับงานที่ต้องใช้สมาธิ ซึ่งช่วงนั้นไม่ต้องรีบตอบข้อความ และทุกคนตกลงให้วันพุธเป็นวันหยุด เพื่อไม่ให้สำนักงานปิดติดกันสองวัน"},
    {en:"At the end of the trial, the company reported that output had not fallen and that fewer staff took sick leave. Not everyone was satisfied, however. Employees who dealt with customers said the shorter week made their days busier, because the same number of calls arrived in less time. The company has decided to continue the four-day week for teams that can plan their own schedules, while customer support keeps five shorter days.",
     th:"เมื่อจบการทดลอง บริษัทรายงานว่าปริมาณงานไม่ลดลงและมีคนลาป่วยน้อยลง แต่ไม่ใช่ทุกคนที่พอใจ พนักงานที่ต้องติดต่อลูกค้าบอกว่าสัปดาห์ที่สั้นลงทำให้แต่ละวันยุ่งขึ้น เพราะสายโทรเข้าจำนวนเท่าเดิมมาในเวลาที่น้อยลง บริษัทจึงให้ทีมที่วางตารางเองได้ทำงาน 4 วันต่อไป ส่วนฝ่ายบริการลูกค้าใช้ 5 วันแต่ชั่วโมงสั้นลง"}
  ]
},
{
  id:"u-roof", kind:"unseen", unit:"—", title:"Painting the Roofs White", th:"บทอ่านใหม่ — ทาหลังคาสีขาวลดความร้อน",
  strategy:"แยก “ผลที่วัดได้” ออกจาก “ข้อจำกัด” และดูว่าผู้เขียนสรุปอย่างไรในย่อหน้าสุดท้าย",
  paras:[
    {en:"In one of the hottest districts of Ahmedabad, India, hundreds of roofs have been painted with a cheap white coating. The idea is simple: a pale surface sends sunlight back instead of storing heat. Inside houses with a painted roof, researchers measured indoor temperatures that were two to five degrees lower on hot afternoons.",
     th:"ในเขตที่ร้อนที่สุดแห่งหนึ่งของเมืองอาห์เมดาบัด ประเทศอินเดีย หลังคาหลายร้อยหลังถูกทาด้วยสารเคลือบสีขาวราคาถูก แนวคิดง่าย ๆ คือพื้นผิวสีอ่อนสะท้อนแสงแดดกลับไปแทนที่จะเก็บความร้อน นักวิจัยวัดอุณหภูมิในบ้านที่ทาหลังคาแล้วพบว่าต่ำลง 2–5 องศาในบ่ายที่ร้อนจัด"},
    {en:"The programme began after a heatwave in which many people became ill. Most of the affected homes had thin metal roofs and no air conditioning. Because the coating costs little and can be applied by the residents themselves, the city was able to reach thousands of households quickly.",
     th:"โครงการเริ่มหลังคลื่นความร้อนที่ทำให้หลายคนล้มป่วย บ้านที่ได้รับผลกระทบส่วนใหญ่มีหลังคาโลหะบางและไม่มีเครื่องปรับอากาศ เพราะสารเคลือบราคาถูกและผู้อยู่อาศัยทาเองได้ เมืองจึงเข้าถึงหลายพันครัวเรือนได้อย่างรวดเร็ว"},
    {en:"White roofs are not a complete answer. The paint must be cleaned or renewed every two or three years, and buildings with thick concrete roofs benefit less. City officials say the coating works best as one part of a wider plan that also includes shaded bus stops, free drinking water points and warnings sent by text message before a heatwave.",
     th:"หลังคาสีขาวไม่ใช่คำตอบทั้งหมด สีต้องทำความสะอาดหรือทาใหม่ทุก 2–3 ปี และอาคารที่มีหลังคาคอนกรีตหนาได้ประโยชน์น้อยกว่า เจ้าหน้าที่เมืองบอกว่าสารเคลือบได้ผลดีที่สุดเมื่อเป็นส่วนหนึ่งของแผนใหญ่ ซึ่งรวมถึงป้ายรถเมล์มีร่มเงา จุดน้ำดื่มฟรี และการส่งข้อความเตือนก่อนคลื่นความร้อน"}
  ]
},
{
  id:"u-quiet", kind:"unseen", unit:"—", title:"A Quiet Hour at the Supermarket", th:"บทอ่านใหม่ — ชั่วโมงเงียบในซูเปอร์มาร์เก็ต",
  strategy:"ระบุว่าใครคือกลุ่มเป้าหมายเดิม อะไรคือผลที่ไม่ได้คาดไว้ และมีอะไรที่ต้องแลกมา",
  paras:[
    {en:"Every Tuesday between six and seven in the evening, a supermarket chain in Wales turns off its music, dims the lights and stops announcements. Checkout scanners are set to their lowest volume. The quiet hour was introduced for customers who find bright light and noise stressful, including some autistic shoppers and people living with dementia.",
     th:"ทุกวันอังคารเวลา 18.00–19.00 น. ซูเปอร์มาร์เก็ตเครือหนึ่งในเวลส์ปิดเพลง หรี่ไฟ และงดประกาศ เครื่องสแกนที่แคชเชียร์ถูกตั้งเสียงเบาที่สุด ชั่วโมงเงียบนี้จัดขึ้นเพื่อลูกค้าที่รู้สึกเครียดกับแสงจ้าและเสียงดัง รวมถึงผู้ซื้อออทิสติกบางคนและผู้ที่มีภาวะสมองเสื่อม"},
    {en:"Staff receive short training before the hour begins. They are asked to speak calmly, avoid moving trolleys around the aisles and give customers more time at the till. A small sign at the entrance explains what is happening, so that shoppers who arrive by chance understand why the shop feels different.",
     th:"พนักงานได้รับการอบรมสั้น ๆ ก่อนเริ่มชั่วโมงนี้ โดยขอให้พูดอย่างใจเย็น เลี่ยงการเข็นรถเข็นไปมาในช่องทางเดิน และให้เวลาลูกค้าที่จุดจ่ายเงินมากขึ้น มีป้ายเล็ก ๆ ที่ทางเข้าอธิบายว่ากำลังเกิดอะไรขึ้น เพื่อให้คนที่บังเอิญแวะเข้ามาเข้าใจว่าทำไมร้านจึงรู้สึกต่างไป"},
    {en:"Managers say the hour has had an unexpected result: many customers with no particular difficulty have started shopping at that time as well, and several have written to ask for a second quiet hour at the weekend. Staff report that the shop is calmer to work in, although stocking shelves must now be done before six.",
     th:"ผู้จัดการบอกว่าชั่วโมงนี้ให้ผลที่ไม่ได้คาดไว้ คือลูกค้าทั่วไปที่ไม่ได้มีข้อจำกัดใดก็เริ่มมาซื้อของช่วงนี้ด้วย และหลายคนเขียนมาขอให้มีชั่วโมงเงียบรอบที่สองในวันหยุด พนักงานบอกว่าร้านทำงานง่ายขึ้นเพราะเงียบกว่า แม้การเติมของขึ้นชั้นจะต้องทำให้เสร็จก่อนหกโมงเย็น"}
  ]
},
{
  id:"u-clouds", kind:"unseen", unit:"—", title:"Reading the Clouds Again", th:"บทอ่านใหม่ — ความรู้ท้องถิ่นกับพยากรณ์อากาศ",
  strategy:"แยกสิ่งที่โครงการ “ทำ” กับสิ่งที่โครงการ “ไม่ได้บอกให้ทำ” และหาผลที่ระบุไว้จริง",
  paras:[
    {en:"For generations, fishing families on the south coast decided whether to sail by watching the colour of the sky, the behaviour of birds and the shape of the clouds. When forecasts on mobile phones arrived, many younger fishers stopped learning these signs. Older fishers worried that useful local knowledge would disappear with them.",
     th:"หลายชั่วอายุคน ครอบครัวชาวประมงชายฝั่งทางใต้ตัดสินใจว่าจะออกเรือหรือไม่จากการดูสีท้องฟ้า พฤติกรรมของนก และรูปร่างของเมฆ เมื่อมีพยากรณ์อากาศในมือถือ ชาวประมงรุ่นใหม่จำนวนมากเลิกเรียนรู้สัญญาณเหล่านี้ คนรุ่นเก่าจึงกังวลว่าความรู้ท้องถิ่นที่มีประโยชน์จะหายไปพร้อมกับพวกเขา"},
    {en:"A small project now records what the older generation knows. Fishers describe the signs they use, and a researcher matches each description with weather data from the same day. Some signs, such as a particular ring around the moon, matched the data closely. Others turned out to be less reliable than the fishers believed.",
     th:"ปัจจุบันมีโครงการเล็ก ๆ บันทึกความรู้ของคนรุ่นเก่า ชาวประมงอธิบายสัญญาณที่ใช้ และนักวิจัยนำคำอธิบายแต่ละอย่างไปเทียบกับข้อมูลอากาศของวันเดียวกัน สัญญาณบางอย่าง เช่น วงแสงรอบดวงจันทร์แบบหนึ่ง ตรงกับข้อมูลอย่างมาก ส่วนบางอย่างกลับเชื่อถือได้น้อยกว่าที่ชาวประมงเคยคิด"},
    {en:"The project does not ask anyone to stop using forecasts. Its aim is different: national forecasts cover a wide area, while local signs can describe conditions in a single bay. The fishers who take part now compare both before deciding, and the researcher says the combination has reduced the number of trips cancelled unnecessarily.",
     th:"โครงการไม่ได้ขอให้ใครเลิกใช้พยากรณ์อากาศ เป้าหมายต่างออกไป คือพยากรณ์ระดับประเทศครอบคลุมพื้นที่กว้าง ขณะที่สัญญาณท้องถิ่นบอกสภาพในอ่าวเดียวได้ ชาวประมงที่เข้าร่วมตอนนี้เทียบทั้งสองอย่างก่อนตัดสินใจ และนักวิจัยบอกว่าการใช้ร่วมกันช่วยลดจำนวนเที่ยวเรือที่ถูกยกเลิกโดยไม่จำเป็น"}
  ]
}
);
