{id:"vx24",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"The faculty will ___ a prize to the best young researcher.",th:"คณะจะ ___ รางวัลให้นักวิจัยรุ่นใหม่ที่ดีที่สุด",c:["award","cheer","lead","represent"],a:0,why:"award ใช้เป็นกริยาแปลว่ามอบรางวัล",clue:"___ a prize to somebody",trap:"cheer = ส่งเสียงเชียร์ • lead = นำ"},
{id:"vx25",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"After the injury, his ___ dropped sharply in the second half of the season.",th:"หลังบาดเจ็บ ___ ของเขาตกลงอย่างมากในครึ่งหลังของฤดูกาล",c:["performance","perform","performer","professional"],a:0,why:"หลัง his ต้องเป็นคำนาม → performance = ผลงาน",clue:"his ___ dropped",trap:"perform เป็นกริยา • performer เป็นคำนามบุคคล"},
{id:"vx26",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"Our team ___ 2–0 at half-time but drew in the end.",th:"ทีมของเรา ___ 2–0 ตอนพักครึ่ง แต่สุดท้ายเสมอ",c:["led","awarded","cheered","represented"],a:0,why:"lead = นำ (ในเกม) รูปอดีตคือ led",clue:"2–0 at half-time",trap:"awarded และ represented ไม่ได้สื่อว่าทำคะแนนนำ"},
{id:"vx27",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"They won a famous ___ against last year's champions.",th:"พวกเขาคว้า ___ ที่โด่งดังเหนือแชมป์เก่าปีที่แล้ว",c:["victory","victorious","victor","athletic"],a:0,why:"หลัง a famous ต้องเป็นคำนาม → victory = ชัยชนะ",clue:"won a famous + คำนาม",trap:"victorious เป็นคำคุณศัพท์ • victor คือตัวบุคคลผู้ชนะ"},
{id:"vx28",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"She felt ___ after finishing a race she thought she could never complete.",th:"เธอรู้สึก ___ หลังจบการแข่งที่คิดว่าตัวเองทำไม่ได้",c:["victorious","victory","victor","athletics"],a:0,why:"หลัง felt ต้องเป็นคำคุณศัพท์ → victorious = รู้สึกเหมือนผู้ชนะ",clue:"felt + adj",trap:"victory และ athletics เป็นคำนาม"},
{id:"vx29",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"He trains six days a week and is remarkably ___ for someone of his age.",th:"เขาฝึกหกวันต่อสัปดาห์และ ___ อย่างน่าทึ่งเมื่อเทียบกับอายุ",c:["athletic","athletics","athlete","award"],a:0,why:"หลัง remarkably ต้องเป็นคำคุณศัพท์ → athletic = แข็งแรงแบบนักกีฬา",clue:"remarkably + adj",trap:"athletics = กรีฑา (คำนาม) • athlete = นักกีฬา (คน)"},
{id:"vx30",sec:"vocab",unit:"3B",topic:"sport",src:"extra",q:"The streaming service lost subscribers after a cheaper ___ entered the market.",th:"บริการสตรีมมิงเสียสมาชิกหลัง ___ ที่ราคาถูกกว่าเข้าสู่ตลาด",c:["competitor","champion","spectator","technique"],a:0,why:"competitor ใช้กับคู่แข่งทางธุรกิจได้ ไม่จำกัดเฉพาะกีฬา",clue:"entered the market",trap:"champion = ผู้ชนะ ไม่ได้แปลว่าคู่แข่ง"},

/* ===== VOCABULARY — Unit 4A: Cause and Result ===== */
{id:"vx31",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Poor ventilation ___ to higher humidity in the storeroom.",th:"การระบายอากาศที่ไม่ดี ___ ความชื้นที่สูงขึ้นในห้องเก็บของ",c:["led","resulted","caused by","affected"],a:0,why:"lead to + noun (รูปอดีต led) = นำไปสู่",clue:"มี to ตามหลังช่องว่าง",trap:"resulted ต้องใช้ resulted in ไม่ใช่ resulted to"},
{id:"vx32",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"The power cut ___ in the loss of two hours of work.",th:"ไฟดับ ___ ให้สูญเสียเวลาทำงานไปสองชั่วโมง",c:["resulted","led","caused","affected"],a:0,why:"result in + noun = ส่งผลให้เกิด",clue:"มี in ตามหลังช่องว่าง",trap:"lead ต้องใช้ lead to • cause และ affect ตามด้วยกรรมตรง ไม่ใช้ in"},
{id:"vx33",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Air pollution can ___ the lungs of young children.",th:"มลพิษทางอากาศอาจ ___ ปอดของเด็กเล็ก",c:["affect","effect","result","cause of"],a:0,why:"หลัง can ต้องเป็นกริยา → affect + กรรม",clue:"can + V1 + กรรม",trap:"effect เป็นคำนาม (have an effect on)"},
{id:"vx34",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Noise from the new road has had a negative ___ on residents' sleep.",th:"เสียงจากถนนสายใหม่มี ___ เชิงลบต่อการนอนของผู้อยู่อาศัย",c:["effect","affect","cause","lead"],a:0,why:"have a negative effect on + คำนาม",clue:"a negative + คำนาม + on",trap:"affect เป็นกริยา จึงอยู่หลัง a negative ไม่ได้"},
{id:"vx35",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"The crack in the wall was ___ by the earthquake last March.",th:"รอยร้าวบนผนัง ___ แผ่นดินไหวเมื่อเดือนมีนาคม",c:["caused","resulted","led","affected"],a:0,why:"ประโยคเริ่มด้วยผล (the crack) → be caused by + สาเหตุ",clue:"was ___ by",trap:"resulted / led ใช้ทิศทาง Cause → Result จึงไม่เข้ากับรูป passive นี้"},
{id:"vx36",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"The outdoor match was postponed as a ___ of heavy rain.",th:"การแข่งขันกลางแจ้งถูกเลื่อน ___ ฝนตกหนัก",c:["result","cause","effect","reason"],a:0,why:"วลีตายตัวคือ as a result of + สาเหตุ",clue:"as a ___ of",trap:"as a cause of / as an effect of ไม่ใช่รูปที่บทเรียนกำหนด"},
{id:"vx37",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"A single typing mistake ___ the whole report to be rejected.",th:"พิมพ์ผิดเพียงจุดเดียว ___ ให้รายงานทั้งฉบับถูกตีกลับ",c:["caused","resulted in","affected","as a result of"],a:0,why:"cause + กรรม + to + V1 = ทำให้เกิดผลตามมา",clue:"___ the whole report to be rejected",trap:"result in ต้องตามด้วยคำนาม/-ing ไม่ใช่ to + V1"},
{id:"vx38",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"The project failed as a result ___ poor planning.",th:"โครงการล้มเหลวเป็นผลมา ___ การวางแผนที่ไม่ดี",c:["of","from","by","to"],a:0,why:"as a result of เท่านั้น",clue:"วลีตายตัวจากบทเรียน",trap:"as a result from เป็นจุดหลอกที่หนังสือเตือนไว้"},
{id:"vx39",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"The storm led ___ hundreds of cancelled flights.",th:"พายุนำไป ___ เที่ยวบินที่ถูกยกเลิกหลายร้อยเที่ยว",c:["to","into","in","on"],a:0,why:"lead to + noun",clue:"รูปตายตัวจากบทเรียน",trap:"lead into เป็นจุดหลอกที่หนังสือเตือนไว้"},
{id:"vx40",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Working night shifts resulted ___ constant tiredness for the whole team.",th:"การทำงานกะดึกส่งผล ___ ความเหนื่อยล้าต่อเนื่องของทั้งทีม",c:["in","on","to","of"],a:0,why:"result in + noun/-ing",clue:"รูปตายตัวจากบทเรียน",trap:"result on เป็นจุดหลอกที่หนังสือเตือนไว้"},
{id:"vx41",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Regular exercise has a positive effect ___ mood and sleep.",th:"การออกกำลังกายสม่ำเสมอมีผลดี ___ อารมณ์และการนอน",c:["on","to","for","in"],a:0,why:"have an effect on + คำนาม",clue:"effect ใช้คู่กับ on เสมอ",trap:"effect to / effect for ไม่ใช่ collocation ที่ถูกต้อง"},
{id:"vx42",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Which sentence begins with the RESULT and then gives the cause?",th:"ประโยคใดเริ่มด้วย “ผลลัพธ์” แล้วจึงบอกสาเหตุ",c:["The delay was caused by poor planning.","Poor planning caused the delay.","Poor planning led to the delay.","Poor planning resulted in the delay."],a:0,why:"be caused by วางผลไว้ต้นประโยคแล้วตามด้วยสาเหตุ (RESULT ← CAUSE)",clue:"ดูว่าอะไรอยู่หน้าช่องว่าง: สาเหตุหรือผล",trap:"อีกสามประโยคเริ่มจากสาเหตุทั้งหมด (CAUSE → RESULT)"},
{id:"vx43",sec:"vocab",unit:"4A",topic:"cause",src:"extra",q:"Second-hand smoke can seriously ___ the health of people nearby.",th:"ควันบุหรี่มือสองอาจ ___ สุขภาพของคนรอบข้างอย่างรุนแรง",c:["affect","effect","result","cause by"],a:0,why:"หลัง can seriously ต้องเป็นกริยา → affect",clue:"can + adverb + V1",trap:"effect เป็นคำนาม จึงใช้ในตำแหน่งกริยาไม่ได้"},

/* ===== VOCABULARY — Unit 4B: Difficulty ===== */
{id:"vx44",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Replacing the tiny watch spring was ___ work that required very steady hands.",th:"การเปลี่ยนลานนาฬิกาชิ้นจิ๋วเป็นงานที่ ___ และต้องใช้มือที่นิ่งมาก",c:["tricky","backbreaking","strict","exhausting"],a:0,why:"tricky = ยากเพราะต้องใช้ความระมัดระวังและทักษะ",clue:"required very steady hands",trap:"backbreaking ใช้กับงานที่ใช้แรงกายหนัก ไม่ใช่งานละเอียด"},
{id:"vx45",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The hospital has ___ rules about mobile phones in the intensive care unit.",th:"โรงพยาบาลมีกฎที่ ___ เรื่องโทรศัพท์มือถือในห้องไอซียู",c:["strict","arduous","exhausting","gruelling"],a:0,why:"strict = เข้มงวดเรื่องกฎที่ต้องปฏิบัติตาม",clue:"คำนามคู่กันคือ rules",trap:"arduous และ gruelling เน้นความยากลำบากทางแรงกายและความเหนื่อย"},
{id:"vx46",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Unloading cement bags from the truck all afternoon is ___ work.",th:"การขนถุงปูนลงจากรถทั้งบ่ายเป็นงานที่ ___",c:["backbreaking","tricky","strict","rigorous"],a:0,why:"backbreaking = หนักมากทางร่างกาย",clue:"ขนถุงปูนทั้งบ่าย",trap:"rigorous เน้นมาตรฐานและความละเอียดของกระบวนการ"},
{id:"vx47",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The pilot training is ___: every candidate is tested on theory and practice twice.",th:"การฝึกนักบิน ___ มาก เพราะผู้เข้ารับการฝึกต้องสอบทั้งทฤษฎีและปฏิบัติอย่างละสองครั้ง",c:["rigorous","tough","punishing","tricky"],a:0,why:"rigorous = ละเอียด เข้มข้น และมีมาตรฐานสูง",clue:"tested on theory and practice twice",trap:"punishing เน้นความหนักและรุนแรงของตารางหรือจังหวะงาน"},
{id:"vx48",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The 14-hour flight followed by a three-hour delay was ___.",th:"เที่ยวบิน 14 ชั่วโมงตามด้วยดีเลย์อีกสามชั่วโมง ___ มาก",c:["exhausting","tricky","strict","rigorous"],a:0,why:"exhausting = ทำให้เหนื่อยมาก",clue:"เดินทางยาวต่อเนื่องแล้วยังต้องรอ",trap:"tricky เน้นความต้องระวัง ไม่ใช่ความเหนื่อย"},
{id:"vx49",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Caring for a newborn while working full time is extremely ___.",th:"การดูแลทารกแรกเกิดพร้อมกับทำงานเต็มเวลาเป็นเรื่อง ___ อย่างยิ่ง",c:["demanding","strict","tricky","backbreaking"],a:0,why:"demanding = ต้องใช้เวลา ความพยายามและความใส่ใจมาก",clue:"ทำสองบทบาทพร้อมกัน",trap:"backbreaking ใช้กับงานที่ใช้แรงกายหนักโดยเฉพาะ"},
{id:"vx50",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The deadline was ___: the team worked until midnight for three weeks.",th:"เส้นตาย ___ มาก ทีมต้องทำงานถึงเที่ยงคืนติดต่อกันสามสัปดาห์",c:["punishing","tricky","strict","demanding"],a:0,why:"punishing = หนักและรุนแรงมาก ใช้กับ deadline/schedule/pace",clue:"ทำถึงเที่ยงคืนติดกันสามสัปดาห์",trap:"strict เน้นกฎที่ต้องทำตาม ไม่ใช่ความหนักของงาน"},
{id:"vx51",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Telling a close friend that you cannot help them is always ___.",th:"การบอกเพื่อนสนิทว่าเราช่วยไม่ได้เป็นเรื่อง ___ เสมอ",c:["tough","backbreaking","rigorous","strict"],a:0,why:"tough = ยากต่อการรับมือ ทั้งทางความคิดและความรู้สึก",clue:"เป็นความยากทางใจ ไม่ใช่ทางกาย",trap:"backbreaking และ rigorous ใช้กับงานหรือกระบวนการ ไม่ใช่ความรู้สึก"},
{id:"vx52",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The crossing took nine days, and the sailors called it the most ___ journey of their lives.",th:"การข้ามทะเลใช้เวลาเก้าวัน ลูกเรือเรียกว่าเป็นการเดินทางที่ ___ ที่สุดในชีวิต",c:["arduous","tricky","strict","demanding"],a:0,why:"arduous = ยากลำบาก ใช้แรงและความพยายามมาก มักใช้กับ journey/task",clue:"คำนามคู่กันคือ journey",trap:"tricky เน้นความซับซ้อนที่ต้องระวัง ไม่ใช่ความยากลำบากยาวนาน"},
{id:"vx53",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"The swimmers follow a ___ schedule of two sessions a day for six weeks.",th:"นักว่ายน้ำทำตามตารางที่ ___ คือวันละสองรอบติดต่อกันหกสัปดาห์",c:["grueling","tricky","strict","rigorous"],a:0,why:"grueling = เหนื่อยและหนักหน่วงต่อเนื่องเป็นเวลานาน",clue:"สองรอบต่อวันตลอดหกสัปดาห์",trap:"strict จะเน้นว่ามีกฎเคร่งครัด ไม่ได้บอกว่าเหนื่อย"},
{id:"vx54",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Which adjective focuses on rules that must be obeyed exactly?",th:"คำคุณศัพท์ใดเน้น “กฎที่ต้องปฏิบัติตามอย่างเคร่งครัด”",c:["strict","demanding","exhausting","arduous"],a:0,why:"strict ผูกกับกฎและการควบคุม",clue:"rules must be obeyed",trap:"demanding/exhausting/arduous เน้นความพยายามและความเหนื่อย"},
{id:"vx55",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Which adjective is used mainly for extremely hard physical labour?",th:"คำคุณศัพท์ใดใช้กับงานที่หนักมากทางร่างกายเป็นหลัก",c:["backbreaking","tricky","strict","rigorous"],a:0,why:"backbreaking ใช้เฉพาะงานที่ใช้แรงกายหนักมาก",clue:"physical labour",trap:"rigorous ใช้กับกระบวนการที่ละเอียดและมีมาตรฐานสูง"},
{id:"vx56",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"That exam question was ___ because two of the options looked correct.",th:"คำถามข้อนั้น ___ เพราะตัวเลือกสองข้อดูถูกทั้งคู่",c:["tricky","backbreaking","exhausting","punishing"],a:0,why:"tricky = ยากเพราะซับซ้อนและต้องระวัง",clue:"two of the options looked correct",trap:"exhausting/punishing เน้นความเหนื่อยและความหนัก ไม่ใช่ความซับซ้อน"},
{id:"vx57",sec:"vocab",unit:"4B",topic:"difficulty",src:"extra",q:"Which noun normally goes with \"punishing\"?",th:"คำนามใดมักใช้คู่กับ punishing",c:["schedule","rules","question","handwriting"],a:0,why:"punishing schedule / punishing pace = ตารางหรือจังหวะงานที่หนักมาก",clue:"จำคำที่ใช้คู่กันช่วยเลือกคำได้เร็วขึ้น",trap:"rules ใช้กับ strict ส่วน question ใช้กับ tricky"},

/* ===== GRAMMAR — เพิ่มเติม ===== */
{id:"gx1",sec:"grammar",unit:"3A",topic:"mwv",src:"extra",q:"Please ___ while the nurse prepares the room.",th:"กรุณา ___ ระหว่างที่พยาบาลเตรียมห้อง",c:["sit down","sit it down","look after","come up with"],a:0,why:"sit down เป็น Type 1 จบได้โดยไม่ต้องมีกรรม",clue:"ไม่มีกรรมตามหลัง",trap:"look after และ come up with ต้องมีกรรมตามหลังเสมอ"},
{id:"gx2",sec:"grammar",unit:"3A",topic:"mwv",src:"extra",q:"She ___ the price labels ___ the gift box before wrapping it.",th:"เธอ ___ ป้ายราคา ___ จากกล่องของขวัญก่อนห่อ",c:["took / off","woke / up","let / down","made / up"],a:0,why:"take sth off = ลอก/เอาออกจากพื้นผิว เป็น Type 2 กรรมแทรกกลางได้",clue:"price labels บนกล่อง",trap:"let down = ทำให้ผิดหวัง • make up = กุเรื่อง"},
{id:"gx3",sec:"grammar",unit:"3A",topic:"mwv",src:"extra",q:"We should not ___ people who do difficult jobs for low pay.",th:"เราไม่ควร ___ คนที่ทำงานหนักแต่ได้ค่าแรงน้อย",c:["look down on","look up to","run out of","try out"],a:0,why:"look down on = ดูถูก (Type 4 ห้ามแยก)",clue:"should not = เตือนไม่ให้ทำสิ่งไม่ดี",trap:"look up to = ชื่นชม ซึ่งตรงข้ามกับบริบท"},
{id:"gx4",sec:"grammar",unit:"3A",topic:"mwv",src:"extra",q:"I will ___ at six, so please do not worry about the alarm.",th:"ฉันจะ ___ ตอนหกโมง จึงไม่ต้องห่วงเรื่องนาฬิกาปลุก",c:["wake up","wake up me","wake me","get away with"],a:0,why:"wake up แบบไม่มีกรรม = ตื่นเอง (Type 1)",clue:"ประธานคือ I และไม่มีใครมาปลุก",trap:"wake up me วาง pronoun ผิด (ต้องเป็น wake me up)"},
{id:"gx5",sec:"grammar",unit:"3A",topic:"mwv",src:"extra",q:"The band ___ after ten years and the members started solo projects.",th:"วงดนตรี ___ หลังอยู่ด้วยกันสิบปี และสมาชิกเริ่มงานเดี่ยว",c:["broke up","broke it up","fell out","looked into"],a:0,why:"break up = เลิกกัน/แยกวง เป็น Type 1",clue:"สมาชิกแยกไปทำงานเดี่ยว",trap:"fall out ต้องใช้ fall out with + คน"},
{id:"gx6",sec:"grammar",unit:"3B",topic:"perfect",src:"extra",q:"She ___ four reports this week, and it is only Wednesday.",th:"สัปดาห์นี้เธอ ___ รายงานไปสี่ฉบับแล้ว ทั้งที่เพิ่งวันพุธ",c:["has written","has been writing","wrote yet","is writing since"],a:0,why:"four reports = จำนวนที่เสร็จแล้วในช่วงเวลาที่ยังไม่จบ",clue:"four + this week",trap:"has been writing เน้นกิจกรรมต่อเนื่อง ไม่ใช่จำนวนที่เสร็จ"},
{id:"gx7",sec:"grammar",unit:"3B",topic:"perfect",src:"extra",q:"I am exhausted because I ___ for the final since eight this morning.",th:"ฉันเพลียมากเพราะ ___ อ่านหนังสือสอบมาตั้งแต่แปดโมงเช้า",c:["have been studying","have studied three","studied","am studying"],a:0,why:"กิจกรรมต่อเนื่องที่อธิบายสภาพปัจจุบัน → Present Perfect Continuous",clue:"since eight + ผลคือความเพลีย",trap:"have studied จะเน้นผลหรือจำนวนที่เสร็จแล้ว"},
{id:"gx8",sec:"grammar",unit:"3B",topic:"perfect",src:"extra",q:"___ you ever ___ to a live orchestra?",th:"คุณเคย ___ ฟังวงออร์เคสตราแสดงสดไหม",c:["Have / been","Has / been","Have / being","Did / been"],a:0,why:"คำถามประสบการณ์: Have + S + V3 (have been to = เคยไป)",clue:"ever = ประสบการณ์",trap:"Has ใช้กับประธานเอกพจน์บุรุษที่ 3 ไม่ใช่ you"},
{id:"gx9",sec:"grammar",unit:"3B",topic:"perfect",src:"extra",q:"The committee ___ already ___ its decision to the students.",th:"คณะกรรมการ ___ ประกาศผลการตัดสินให้นักศึกษาทราบ ___ แล้ว",c:["has / announced","have / announcing","has / been announce","is / announced"],a:0,why:"already + ผลที่เพิ่งเสร็จ → has + V3",clue:"already เป็นคำใบ้ของ Present Perfect",trap:"have ไม่สอดคล้องกับ committee ที่ถูกมองเป็นเอกพจน์ในประโยคนี้"},
{id:"gx10",sec:"grammar",unit:"3B",topic:"perfect",src:"extra",q:"We ___ for two hours and the bus still has not arrived.",th:"เรา ___ มาสองชั่วโมงแล้วและรถเมล์ก็ยังไม่มา",c:["have been waiting","have waited twice","waited","are waiting since"],a:0,why:"for two hours + กิจกรรมที่ยังดำเนินอยู่ → Perfect Continuous",clue:"for two hours",trap:"waited เป็นอดีตที่จบแล้ว ไม่เชื่อมกับปัจจุบัน"},
{id:"gx11",sec:"grammar",unit:"4A",topic:"usedto",src:"extra",q:"There ___ a cinema on this corner, but it closed in 2015.",th:"ตรงหัวมุมนี้ ___ โรงหนัง แต่ปิดไปเมื่อปี 2015",c:["used to be","would be","is used to be","used being"],a:0,why:"be = state verb จึงใช้ used to be กับสภาวะในอดีต",clue:"ปัจจุบันไม่มีแล้ว",trap:"would be ไม่ใช้กับสภาวะทั่วไปในอดีต"},
{id:"gx12",sec:"grammar",unit:"4A",topic:"usedto",src:"extra",q:"He ___ smoke after meals, but he gave up two years ago.",th:"เขา ___ สูบบุหรี่หลังอาหาร แต่เลิกไปเมื่อสองปีก่อน",c:["used to","is used to","would be","use to"],a:0,why:"used to + V1 = เคยทำเป็นประจำในอดีตแต่ตอนนี้ไม่แล้ว",clue:"but he gave up",trap:"is used to + -ing = คุ้นเคยในปัจจุบัน คนละความหมาย"},
{id:"gx13",sec:"grammar",unit:"4A",topic:"usedto",src:"extra",q:"During the floods, neighbours ___ share food every evening.",th:"ช่วงน้ำท่วม เพื่อนบ้าน ___ แบ่งอาหารกันทุกเย็น",c:["would","are used to","used","would be"],a:0,why:"การกระทำซ้ำในอดีตที่มีบริบทเวลาชัดเจน → would + V1",clue:"During the floods + every evening",trap:"used ต้องมี to (used to share)"},
{id:"gx14",sec:"grammar",unit:"4A",topic:"usedto",src:"extra",q:"I have just moved to Japan and I am not ___ driving on the left yet.",th:"ฉันเพิ่งย้ายมาญี่ปุ่นและยังไม่ ___ ขับรถเลนซ้าย",c:["used to","use to","would","getting use to"],a:0,why:"be used to + -ing = คุ้นเคยกับสิ่งนั้นแล้ว (รูปปฏิเสธคือยังไม่คุ้น)",clue:"am not ___ driving",trap:"use to ใช้ได้เฉพาะหลัง did/didn't"},
{id:"gx15",sec:"grammar",unit:"4A",topic:"usedto",src:"extra",q:"My sister ___ live in Chiang Mai any more; she moved to Rayong.",th:"พี่สาวฉัน ___ อยู่เชียงใหม่แล้ว เธอย้ายไปอยู่ระยอง",c:["does not","no longer","did not use to","is not used to"],a:0,why:"any more ใช้คู่กับกริยาปฏิเสธและอยู่ท้ายประโยค",clue:"มี any more ท้ายประโยค",trap:"no longer live … any more ซ้ำซ้อน ต้องเลือกใช้อย่างใดอย่างหนึ่ง"},
{id:"gx16",sec:"grammar",unit:"4B",topic:"obligation",src:"extra",q:"Passengers ___ fasten their seatbelts during take-off; it is a safety regulation.",th:"ผู้โดยสาร ___ คาดเข็มขัดนิรภัยระหว่างเครื่องขึ้น เพราะเป็นกฎความปลอดภัย",c:["have to","do not have to","are allowed to","need not"],a:0,why:"กฎจากภายนอก = ความจำเป็น → have to + V1",clue:"it is a safety regulation",trap:"are allowed to = ได้รับอนุญาต ไม่ใช่ถูกบังคับ"},
{id:"gx17",sec:"grammar",unit:"4B",topic:"obligation",src:"extra",q:"You ___ pay now; you can pay when you collect the order.",th:"คุณ ___ จ่ายตอนนี้ จ่ายตอนมารับของก็ได้",c:["do not have to","must not","are not allowed to","had to"],a:0,why:"มีทางเลือกจ่ายภายหลัง = ไม่จำเป็นต้องทำตอนนี้",clue:"you can pay when you collect",trap:"must not จะหมายถึง “ห้ามจ่ายตอนนี้”"},
{id:"gx18",sec:"grammar",unit:"4B",topic:"obligation",src:"extra",q:"Children under twelve ___ use the gym equipment without an adult.",th:"เด็กอายุต่ำกว่าสิบสองปี ___ ใช้อุปกรณ์ฟิตเนสโดยไม่มีผู้ใหญ่",c:["are not allowed to","do not have to","should","need not"],a:0,why:"เป็นข้อห้ามตามกฎของสถานที่ → are not allowed to",clue:"without an adult = เงื่อนไขของกฎ",trap:"do not have to / need not = ไม่จำเป็น ซึ่งไม่ใช่การห้าม"},
{id:"gx19",sec:"grammar",unit:"4B",topic:"obligation",src:"extra",q:"We ___ to arrive at eight, but the meeting started late anyway.",th:"เรา ___ มาถึงตอนแปดโมง แต่สุดท้ายประชุมก็เริ่มช้าอยู่ดี",c:["were supposed","must","are supposed","had"],a:0,why:"was/were supposed to = ถูกคาดหวังให้ทำ (รูปอดีต)",clue:"มี to ตามหลัง และเหตุการณ์อยู่ในอดีต",trap:"are supposed เป็นรูปปัจจุบัน ไม่ตรงกับเหตุการณ์ที่ผ่านไปแล้ว"},
{id:"gx20",sec:"grammar",unit:"4B",topic:"obligation",src:"extra",q:"The new rule ___ every visitor wear a badge inside the laboratory.",th:"กฎใหม่ ___ ให้ผู้มาเยือนทุกคนติดบัตรในห้องปฏิบัติการ",c:["makes","lets to","allows wear","made to"],a:0,why:"make + object + V1 (ไม่มี to)",clue:"every visitor wear (V1 ไม่มี to)",trap:"allows ต้องตามด้วย to wear • made to ผิดใน active"},

/* ===== READING — เพิ่มคำถามให้บทอ่านเดิม (seen) ===== */
{id:"rx1",sec:"reading",unit:"3A",topic:"r-learning",src:"extra",q:"What does Text A suggest about afternoon hours?",th:"บทอ่าน A บอกอะไรเกี่ยวกับช่วงบ่าย",c:["Physical strength and coordination may be better then.","Nobody can concentrate after lunch.","Memory techniques only work after 2 p.m.","Talent matters more in the afternoon."],a:0,why:"บทอ่านระบุว่าความแข็งแรงและการประสานงานของร่างกายอาจดีกว่าในช่วงราว 14–18 น.",clue:"แยก “งานสมอง” ช่วงสาย ออกจาก “งานกาย” ช่วงบ่าย",trap:"ตัวเลือกอื่นใช้คำเด็ดขาดหรือเพิ่มข้อมูลที่บทอ่านไม่ได้ระบุ"},
{id:"rx2",sec:"reading",unit:"3A",topic:"r-learning",src:"extra",q:"Which memory tool is NOT mentioned in Text B?",th:"วิธีช่วยจำข้อใดไม่ได้ถูกกล่าวถึงใน Text B",c:["writing with your non-dominant hand","association","mental pictures","mnemonics"],a:0,why:"Text B กล่าวถึง association, mental pictures และ mnemonics เท่านั้น",clue:"คำถามแบบ NOT ให้ไล่ตัดสิ่งที่พบในบทอ่าน",trap:"อย่าเลือกตัวเลือกที่ฟังดูเป็นเทคนิคจริงแต่บทอ่านไม่ได้พูดถึง"},
{id:"rx3",sec:"reading",unit:"3A",topic:"r-learning",src:"extra",q:"What is the main idea of Text B?",th:"ใจความหลักของ Text B คืออะไร",c:["Information is easier to remember when it is meaningful or linked to something familiar.","Repeating a list many times is the only way to remember it.","Memory depends on the time of day.","Only talented people have a good memory."],a:0,why:"Text B เน้นว่าข้อมูลที่มีความหมายหรือเชื่อมกับสิ่งที่รู้อยู่แล้วจะจำง่ายกว่า",clue:"association เป็นแกนของย่อหน้านี้",trap:"บทอ่านบอกว่าความจำดีขึ้นจากการเชื่อมโยงอย่างมีระบบ ไม่ใช่การท่องซ้ำอย่างเดียว"},
{id:"rx4",sec:"reading",unit:"3A",topic:"r-learning",src:"extra",q:"Which statement best describes how the three mini-texts fit together?",th:"ข้อใดอธิบายความเชื่อมโยงของทั้งสามส่วนได้ดีที่สุด",c:["They cover when we learn, how we remember and how much practice matters.","They all argue that talent is useless.","They each describe one famous athlete.","They compare schools in different countries."],a:0,why:"A = เวลา, B = ความจำ, C = พรสวรรค์เทียบการฝึก",clue:"ถามภาพรวม ไม่ใช่รายละเอียดจุดเดียว",trap:"อย่าเปลี่ยน “การฝึกสำคัญ” ให้เป็น “พรสวรรค์ไร้ค่า”"},
{id:"rx5",sec:"reading",unit:"3B",topic:"r-born",src:"extra",q:"Which physical feature does the passage link to the Kalenjin runners?",th:"บทอ่านเชื่อมลักษณะทางกายข้อใดกับนักวิ่ง Kalenjin",c:["relatively long legs with lighter lower legs","an unusually long arm span","a very high level of red blood cells","a lower centre of gravity"],a:0,why:"บทอ่านระบุขาและข้อเท้าที่บาง ขาค่อนข้างยาว และช่วงขาล่างที่เบากว่า",clue:"เชื่อมลักษณะขากับการวิ่งระยะไกล",trap:"ช่วงแขนเป็นของ Nate Robinson • เม็ดเลือดแดงเป็นของ Eero"},
{id:"rx6",sec:"reading",unit:"3B",topic:"r-born",src:"extra",q:"Besides a lower centre of gravity, what else does the passage credit for Pulisic's balance?",th:"นอกจากจุดศูนย์ถ่วงต่ำ บทอ่านยกปัจจัยใดอีกที่ช่วยการทรงตัวของ Pulisic",c:["training and technique","luck and attitude","his arm span","a rare gene"],a:0,why:"บทอ่านระบุว่าจุดศูนย์ถ่วงต่ำทำงานร่วมกับการฝึกและเทคนิค",clue:"บทอ่านไม่ได้อธิบายด้วยรูปร่างอย่างเดียว",trap:"luck และ attitude เป็นปัจจัยที่บทอ่านไม่ได้ระบุ"},
{id:"rx7",sec:"reading",unit:"3B",topic:"r-born",src:"extra",q:"What did Eero Mäntyranta achieve in 1964 according to the passage?",th:"ตามบทอ่าน Eero Mäntyranta ทำอะไรได้ในปี 1964",c:["He won a 15-km race by 40 seconds.","He set a new arm-span record.","He joined a football team.","He trained for 10,000 hours."],a:0,why:"บทอ่านระบุชัยชนะในการแข่ง 15 กม. ปี 1964 ด้วยระยะห่าง 40 วินาที",clue:"ตัวเลขปีและวินาทีเป็น detail clue",trap:"10,000 ชั่วโมงเป็นตัวเลขจากบทอ่าน Learning to Learn คนละเรื่องกัน"},
{id:"rx8",sec:"reading",unit:"3B",topic:"r-born",src:"extra",q:"Why should \"fitness, luck and attitude\" be rejected as answers for this passage?",th:"ทำไมจึงไม่ควรเลือก fitness, luck หรือ attitude เป็นคำตอบของบทอ่านนี้",c:["The passage never states them as factors.","They are the opposite of the writer's view.","They appear only in the title.","They apply only to basketball."],a:0,why:"ตอบได้เฉพาะปัจจัยที่บทอ่านระบุไว้จริง",clue:"หลักฐานในบทอ่านคือสิ่งตัดสิน",trap:"สิ่งที่ “น่าจะจริง” ในชีวิตจริงไม่ใช่หลักฐานในข้อสอบ"},
{id:"rx9",sec:"reading",unit:"4A",topic:"r-life",src:"extra",q:"How did Rupesh get the money to travel to London?",th:"Rupesh ได้เงินไปลอนดอนมาอย่างไร",c:["He sold his motorbike for £600.","He won a cookery competition.","He borrowed £55 million.","His grandmother gave him vouchers."],a:0,why:"บทอ่านระบุว่าเขาขายมอเตอร์ไซค์ได้ £600 แล้วซื้อตั๋วเที่ยวเดียว",clue:"motorbike → single ticket",trap:"การแข่งทำอาหารและคูปองส่วนลดเป็นรายละเอียดของ Mark"},
{id:"rx10",sec:"reading",unit:"4A",topic:"r-life",src:"extra",q:"What did Mark Pearson's grandmother's discount vouchers lead to?",th:"คูปองส่วนลดของคุณยาย Mark นำไปสู่อะไร",c:["the idea for an online discount business","a job in a restaurant in London","his decision to leave school","a chai tea company"],a:0,why:"คูปองในตู้เย็นของคุณยายจุดประกายไอเดียธุรกิจเว็บส่วนลด",clue:"fridge → vouchers → online website",trap:"ธุรกิจชาเป็นของ Rupesh ไม่ใช่ Mark"},
{id:"rx11",sec:"reading",unit:"4A",topic:"r-life",src:"extra",q:"What does Rupesh's company sell?",th:"บริษัทของ Rupesh ขายอะไร",c:["chai tea, in Britain and abroad","second-hand motorbikes","discount vouchers online","cookery courses"],a:0,why:"บทอ่านระบุว่าบริษัทขายชาในอังกฤษและทั่วโลก",clue:"TukTuk Chai",trap:"คูปองส่วนลดออนไลน์เป็นธุรกิจของ Mark"},
{id:"rx12",sec:"reading",unit:"4A",topic:"r-life",src:"extra",q:"Which statement about the two men is supported by the passage?",th:"ข้อใดเกี่ยวกับชายทั้งสองที่บทอ่านสนับสนุน",c:["Both became successful entrepreneurs, but by different routes.","Both left school at sixteen.","Both started businesses selling food abroad.","Both inherited money from their families."],a:0,why:"จุดเริ่มต้นและจุดเปลี่ยนต่างกัน แต่ปลายทางคือการเป็นผู้ประกอบการที่สำเร็จ",clue:"เทียบ “จุดเริ่มต้น → โอกาส → ผล” ของทั้งคู่",trap:"การออกจากโรงเรียนตอน 16 เป็นเรื่องของ Mark เท่านั้น"},
{id:"rx13",sec:"reading",unit:"4B",topic:"r-emergency",src:"extra",q:"What does Joe Conte do during the day?",th:"Joe Conte ทำงานอะไรในเวลากลางวัน",c:["He works as a computer programmer.","He is a full-time rescue worker.","He teaches mountaineering at a college.","He works as an A&E nurse."],a:0,why:"บทอ่านระบุว่าเขาเป็นอาสาสมัครกู้ภัย และทำงานเป็นโปรแกรมเมอร์ตอนกลางวัน",clue:"volunteer + computer programmer by day",trap:"พยาบาล A&E คือ Amelia ไม่ใช่ Joe"},
{id:"rx14",sec:"reading",unit:"4B",topic:"r-emergency",src:"extra",q:"How much ongoing training do fully trained volunteers do each year?",th:"อาสาสมัครที่ผ่านการฝึกเต็มรูปแบบแล้วยังต้องฝึกต่อปีละเท่าไร",c:["about 300 hours","about 40 hours","about two years","about six weeks"],a:0,why:"บทอ่านระบุราว 300 ชั่วโมงต่อปี แม้ผ่านหลักสูตรแล้ว",clue:"ongoing training each year",trap:"สองปีคือระยะเวลาของหลักสูตรหลัก ไม่ใช่การฝึกต่อเนื่องรายปี"},

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
/* สลับตำแหน่งตัวเลือกทุกครั้งที่หยิบข้อมาทำ เพื่อไม่ให้คำตอบไปกองอยู่ที่ตัวเลือกเดียว */
function withShuffledChoices(q){
  var order = shuffle(q.c.map(function(_,i){ return i; })), copy = {};
  for(var k in q) copy[k] = q[k];
  copy.c = order.map(function(i){ return q.c[i]; });
  copy.a = order.indexOf(q.a);

/* =========================================================
   DRILL (ฝึกทำข้อ — เฉลยทันที)
   ========================================================= */
var drillFilter = {sec:"all", topics:[], count:20};
var run = null; /* {items, i, picks, mode, started, limit} */

function buildDrill(){
  var pool = Q.filter(function(q){
    if(drillFilter.sec!=="all" && q.sec!==drillFilter.sec) return false;
    if(drillFilter.topics.length && drillFilter.topics.indexOf(q.topic)<0) return false;
    return true;
  });
  var list = shuffle(pool);
  var n = drillFilter.count;
  return n>0 ? list.slice(0, n) : list;
}
function startWrongSet(){
  var pool = Q.filter(function(q){ var s=stat(q.id); return s.no>0 && s.no>=s.ok; });
  if(!pool.length){ alert2("ยังไม่มีข้อที่เคยตอบผิดค้างอยู่ — ลองทำชุดคละก่อน"); return; }
  startDrill(shuffle(pool).slice(0,25));
}
function alert2(msg){
  var d=document.createElement("div");
  d.className="card"; d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:var(--shadow);max-width:min(92vw,420px)";
  d.textContent=msg; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600);
}
function startDrill(items){
  if(!items.length){ alert2("ไม่มีข้อที่ตรงกับตัวกรองนี้"); return; }
  items = items.map(withShuffledChoices);
  run = {items:items, i:0, picks:items.map(function(){ return null; }), mode:"drill"};
  renderDrill();
}
function renderDrill(){
  if(run && run.mode==="drill"){ renderRunner(); return; }
  var counts = {all:Q.length, vocab:0, grammar:0, reading:0};
  Q.forEach(function(q){ counts[q.sec]++; });
  var groups = [
    {name:"Vocabulary", keys:["ability","sport","cause","difficulty"]},
    {name:"Grammar", keys:["mwv","perfect","usedto","obligation"]},
    {name:"Reading — seen (บทอ่านที่เรียนแล้ว)", keys:P.readings.filter(function(r){ return r.kind==="seen"; }).map(function(r){ return r.id; })},
    {name:"Reading — unseen (บทอ่านใหม่)", keys:P.readings.filter(function(r){ return r.kind==="unseen"; }).map(function(r){ return r.id; })}
  ];
  app.innerHTML =
  '<section class="view">'+
    '<div class="card">'+
      '<p class="eyebrow">ฝึกทำข้อ · เฉลยทันทีพร้อมเหตุผลและจุดหลอก</p>'+
      '<h1 style="font-size:1.35rem;margin-top:6px">เลือกชุดที่จะฝึก</h1>'+
      '<p class="lead" style="margin-top:4px">คลังมี '+Q.length+' ข้อ — Vocabulary '+counts.vocab+' · Grammar '+counts.grammar+' · Reading '+counts.reading+'</p>'+
      '<div class="row" style="margin-top:12px">'+
        ['all','vocab','grammar','reading'].map(function(k){
          return '<button class="chip" aria-pressed="'+(drillFilter.sec===k)+'" data-sec="'+k+'">'+(k==="all"?"ทุกส่วน":secLabel(k))+' ('+counts[k]+')</button>'; }).join("")+
      '</div>'+
      '<div class="row" style="margin-top:8px">จำนวนข้อ: '+
        [10,20,30,0].map(function(n){ return '<button class="chip" aria-pressed="'+(drillFilter.count===n)+'" data-count="'+n+'">'+(n?n:"ทั้งหมด")+'</button>'; }).join("")+
      '</div>'+
      '<div class="row" style="margin-top:14px"><button class="btn" id="startdrill">เริ่มฝึก</button>'+
        '<button class="btn ghost" id="startwrong">ทบทวนข้อที่เคยผิด</button>'+
        (drillFilter.topics.length?'<button class="btn ghost" id="clrtopics">ล้างหัวข้อที่เลือก ('+drillFilter.topics.length+')</button>':'')+
      '</div>'+
    '</div>'+
    groups.map(function(g){
      return '<div class="card"><p class="eyebrow">'+g.name+'</p><div class="row" style="margin-top:10px">'+
        g.keys.map(function(k){ var s=topicScore(k);
          return '<button class="chip" aria-pressed="'+(drillFilter.topics.indexOf(k)>=0)+'" data-topic="'+k+'">'+esc(TOPICS[k])+
            ' <span class="num" style="opacity:.7">'+s.size+(s.pct!==null?' · '+s.pct+'%':'')+'</span></button>'; }).join("")+
      '</div></div>';
    }).join("")+
  '</section>';
  app.querySelectorAll("[data-sec]").forEach(function(b){ b.addEventListener("click", function(){ drillFilter.sec=b.dataset.sec; renderDrill(); }); });
  app.querySelectorAll("[data-count]").forEach(function(b){ b.addEventListener("click", function(){ drillFilter.count=+b.dataset.count; renderDrill(); }); });
  app.querySelectorAll("[data-topic]").forEach(function(b){ b.addEventListener("click", function(){
    var k=b.dataset.topic, i=drillFilter.topics.indexOf(k);
    if(i<0) drillFilter.topics.push(k); else drillFilter.topics.splice(i,1);
    renderDrill();
  }); });
  var c=document.getElementById("clrtopics"); if(c) c.addEventListener("click", function(){ drillFilter.topics=[]; renderDrill(); });
  document.getElementById("startdrill").addEventListener("click", function(){ startDrill(buildDrill()); });
  document.getElementById("startwrong").addEventListener("click", startWrongSet);
}

/* ไฮไลต์ประโยคหลักฐานในบทอ่าน: escape ก่อน แล้วจึงครอบ <mark> เฉพาะช่วงที่ตรงกัน */
function hlText(txt, hl){
  var e = esc(txt);
  if(!hl) return e;
  var h = esc(hl), i = e.indexOf(h);
  if(i < 0) return e;
  return e.slice(0,i) + '<mark>' + e.slice(i, i+h.length) + '</mark>' + e.slice(i+h.length);
}
function passageHTML(topic, hl, open){
  var r = reading(topic); if(!r) return "";
  if(open === undefined) open = hl ? true : r.kind==="unseen";
  var body;
  if(r.paras){
    body = r.paras.map(function(p,i){
      return '<div><p><span class="pnum">¶'+(i+1)+'</span>'+hlText(p.en,hl)+'</p><p class="thai">'+hlText(p.th,hl)+'</p></div>'; }).join("");
  } else {
    body = (r.table ? '<div class="scroll"><table><thead><tr>'+r.table.head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join("")+
        '</tr></thead><tbody>'+r.table.rows.map(function(row){ return '<tr>'+row.map(function(c){ return '<td>'+hlText(c,hl)+'</td>'; }).join("")+'</tr>'; }).join("")+
        '</tbody></table></div>' : '')+
      (r.sections||[]).map(function(s){
        return '<div><p><b>'+hlText(s.h,hl)+'</b></p><p class="thai">'+hlText(s.th,hl)+'</p><p>'+hlText(s.main,hl)+'</p>'+
          '<ul class="thai">'+(s.ev||[]).map(function(e){ return '<li>'+hlText(e,hl)+'</li>'; }).join("")+'</ul>'+
          (s.trap ? '<p class="thai">กับดัก: '+hlText(s.trap,hl)+'</p>' : '')+'</div>'; }).join("");
  }
  return '<details'+(open?" open":"")+' style="margin-top:12px"><summary>'+(r.kind==="unseen"?'บทอ่าน':'สรุปหลักฐานของบทอ่าน')+': '+esc(r.title)+
    (hl?' · ไฮไลต์คือหลักฐานของข้อนี้':'')+'</summary>'+
    '<div class="passage" style="margin-top:8px">'+body+'</div></details>';
}
function renderRunner(){
  var mock = run.mode==="mock";
  var q = run.items[run.i], pick = run.picks[run.i], answered = pick!==null;
  var showKey = answered && !mock;
  app.innerHTML =
  '<section class="view">'+
    '<div class="card">'+
      '<div class="qmeta">'+
        '<b class="num" style="color:var(--ink)">ข้อ '+(run.i+1)+' / '+run.items.length+'</b>'+
        '<span class="badge'+(q.sec==="reading"?'':' ac')+'">'+secLabel(q.sec)+'</span>'+
        '<span class="unitpill">'+esc(q.unit==="—"?"unseen":"Unit "+q.unit)+'</span>'+
        '<span>'+esc(TOPICS[q.topic]||"")+'</span>'+
        (q.src==="extra"?'<span class="badge">extra</span>':'')+
        '<span class="spacer"></span>'+
        (mock?'<span class="timer" id="clock">—</span>':'')+
      '</div>'+
      (q.sec==="reading"?passageHTML(q.topic, showKey?q.hl:null):"")+
      '<p class="qtext">'+esc(q.q)+'</p>'+
      '<p class="qth">'+esc(q.th)+'</p>'+
      '<div class="opts">'+ q.c.map(function(c,i){
        var s = "";
        if(showKey){ if(i===q.a) s="ok"; else if(i===pick) s="bad"; }
        else if(pick===i) s="pick";
        return '<button class="opt" data-opt="'+i+'"'+(s?' data-s="'+s+'"':'')+(showKey?' disabled':'')+'>'+
          '<kbd>'+"ABCD"[i]+'</kbd><span>'+esc(c)+'</span></button>'; }).join("")+
      '</div>'+
      (showKey ? '<div class="explain">'+
        '<p class="verdict '+(pick===q.a?'ok':'bad')+'">'+(pick===q.a?'ถูกต้อง':'ยังไม่ถูก — คำตอบคือ '+"ABCD"[q.a]+'. '+esc(q.c[q.a]))+'</p>'+
        '<div><p class="k">ทำไมถูก</p><p>'+esc(q.why)+'</p></div>'+
        '<div><p class="k">คำใบ้ในโจทย์</p><p>'+esc(q.clue)+'</p></div>'+
        '<div><p class="k">ตัวลวงที่ต้องระวัง</p><p>'+esc(q.trap)+'</p></div>'+
      '</div>' : '')+
      '<div class="pager">'+
        '<button class="btn ghost" data-nav="prev"'+(run.i===0?' disabled':'')+'>‹ ย้อน</button>'+
        '<div class="row">'+
          (mock? '<button class="btn" id="submitmock">ส่งคำตอบ ('+run.picks.filter(function(p){return p!==null;}).length+'/'+run.items.length+')</button>'
               : '<button class="btn ghost" data-nav="quit">ออกจากชุดนี้</button>')+
          '<button class="btn" data-nav="next"'+(run.i===run.items.length-1?' disabled':'')+'>ถัดไป ›</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><p class="eyebrow">กระดาษคำตอบ</p><div class="sheet" style="margin-top:10px">'+
      run.items.map(function(x,i){
        var p=run.picks[i], res="";
        if(!mock && p!==null) res = p===x.a?"ok":"bad";
        return '<button data-jump="'+i+'" data-done="'+(p!==null?1:0)+'"'+(res?' data-res="'+res+'"':'')+(i===run.i?' aria-current="true"':'')+'>'+(i+1)+'</button>'; }).join("")+
    '</div></div>'+
  '</section>';

  app.querySelectorAll("[data-opt]").forEach(function(b){ b.addEventListener("click", function(){
    var i=+b.dataset.opt;
    if(!mock){ if(run.picks[run.i]!==null) return; run.picks[run.i]=i; record(q.id, i===q.a); }
    else { run.picks[run.i]=i; }
    renderRunner();
    if(mock && run.i<run.items.length-1) setTimeout(function(){ run.i++; renderRunner(); }, 140);
  }); });
  app.querySelectorAll("[data-nav]").forEach(function(b){ b.addEventListener("click", function(){
    var k=b.dataset.nav;
    if(k==="prev" && run.i>0) run.i--;
    else if(k==="next" && run.i<run.items.length-1) run.i++;
    else if(k==="quit"){ finishDrill(); return; }
    renderRunner();
  }); });
  app.querySelectorAll("[data-jump]").forEach(function(b){ b.addEventListener("click", function(){ run.i=+b.dataset.jump; renderRunner(); }); });
  var sm=document.getElementById("submitmock"); if(sm) sm.addEventListener("click", submitMock);
  if(mock) tick();
}
function finishDrill(){
  var done = run.picks.filter(function(p){ return p!==null; }).length;
  var right = run.picks.filter(function(p,i){ return p===run.items[i].a; }).length;
  var items = run.items, picks = run.picks;
  run = null;
  app.innerHTML =
  '<section class="view"><div class="card">'+
    '<p class="eyebrow">สรุปชุดฝึก</p>'+
    '<h1 style="font-size:1.6rem;margin-top:6px" class="num">'+right+' / '+done+' ข้อที่ทำ</h1>'+
    '<p class="lead">ทั้งชุดมี '+items.length+' ข้อ</p>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="again">ฝึกชุดใหม่</button>'+
      '<button class="btn ghost" id="wrongnow">ทบทวนข้อที่ผิดในชุดนี้</button></div>'+
  '</div>'+
  (picks.some(function(p,i){ return p!==null && p!==items[i].a; }) ?
   '<div class="card"><p class="eyebrow">ข้อที่ตอบผิด</p><div class="grid" style="margin-top:10px">'+
    items.map(function(x,i){ if(picks[i]===null || picks[i]===x.a) return "";
      return '<div style="border-top:1px solid var(--line);padding-top:10px"><p style="font-weight:500">'+esc(x.q)+'</p>'+
        '<p class="lead" style="font-size:.86rem">'+esc(x.th)+'</p>'+
        '<p style="margin-top:6px"><span class="badge" style="background:var(--bad-soft);color:var(--bad)">คุณตอบ</span> '+esc(x.c[picks[i]])+'</p>'+
        '<p><span class="badge" style="background:var(--ok-soft);color:var(--ok)">คำตอบ</span> '+esc(x.c[x.a])+'</p>'+
        '<p class="lead" style="margin-top:6px">'+esc(x.why)+'</p>'+
        (x.sec==="reading"?passageHTML(x.topic, x.hl, false):"")+'</div>'; }).join("")+
   '</div></div>' : '')+
  '</section>';
  document.getElementById("again").addEventListener("click", renderDrill);
  document.getElementById("wrongnow").addEventListener("click", function(){
    var w = items.filter(function(x,i){ return picks[i]!==null && picks[i]!==x.a; });
    if(!w.length){ alert2("ชุดนี้ไม่มีข้อที่ผิด"); return; }
    startDrill(shuffle(w));
  });
}

/* =========================================================
   MOCK EXAM
   ========================================================= */
var LIMIT = 80*60*1000;
/* เลือกข้อที่ “สดใหม่” ก่อน: เลี่ยงข้อที่เพิ่งออกในสองรอบล่าสุด และข้อที่ทำถูกบ่อยแล้ว */
function pickFresh(pool, n){
  return pool.map(function(q){
    var s = stat(q.id);
    return {q:q, w:(S.recent[q.id]||0)*100 + (s.ok+s.no)*3 + s.ok*2 + Math.random()*5};
  }).sort(function(a,b){ return a.w-b.w; }).slice(0,n).map(function(x){ return x.q; });
}
function markUsed(items, passages){
  Object.keys(S.recent).forEach(function(k){ if(--S.recent[k]<=0) delete S.recent[k]; });
  Object.keys(S.recentP).forEach(function(k){ if(--S.recentP[k]<=0) delete S.recentP[k]; });
  items.forEach(function(q){ S.recent[q.id]=2; });
  (passages||[]).forEach(function(k){ S.recentP[k]=2; });
  save();
}
function buildMock(){
  var out = [];
  ["vocab","grammar"].forEach(function(sec){
    out = out.concat(pickFresh(Q.filter(function(q){ return q.sec===sec; }), 30));
  });
  var groups = {};
  Q.filter(function(q){ return q.sec==="reading"; }).forEach(function(q){ (groups[q.topic]=groups[q.topic]||[]).push(q); });
  function pickGroups(kind, n){
    return Object.keys(groups).filter(function(k){ var r=reading(k); return r && r.kind===kind && groups[k].length>=5; })
      .map(function(k){ return {k:k, w:(S.recentP[k]||0)*10 + Math.random()}; })
      .sort(function(a,b){ return a.w-b.w; }).slice(0,n).map(function(x){ return x.k; });
  }
  var chosen = pickGroups("seen",2).concat(pickGroups("unseen",2));
  chosen.forEach(function(k){ out = out.concat(shuffle(pickFresh(groups[k], 5))); });
  markUsed(out, chosen);
  return out;
}
function renderMock(){
  if(run && run.mode==="mock"){ renderRunner(); return; }
  var hist = S.mocks.slice(-5).reverse();
  app.innerHTML =
  '<section class="view">'+
    '<div class="card">'+
      '<p class="eyebrow">สอบจำลอง</p>'+
      '<h1 style="font-size:1.5rem;margin-top:6px">80 ข้อ · 80 นาที · ไม่เฉลยจนส่ง</h1>'+
      '<p class="lead" style="margin-top:6px">สัดส่วนตามแนวข้อสอบจริง: Vocabulary 30 · Grammar 30 · Reading 20 — ส่วน Reading สุ่มมาเป็น “บท” 4 บท (seen 2 + unseen 2) บทละ 5 ข้อ</p>'+
      '<p class="lead" style="margin-top:6px">คลังมี '+Q.length+' ข้อ (Vocabulary '+Q.filter(function(q){return q.sec==="vocab";}).length+' · Grammar '+Q.filter(function(q){return q.sec==="grammar";}).length+' · Reading '+Q.filter(function(q){return q.sec==="reading";}).length+' จาก '+P.readings.length+' บทอ่าน) และระบบจะเลี่ยงข้อกับบทอ่านที่เพิ่งออกในสองรอบล่าสุด จึงสอบซ้ำได้โดยแทบไม่เจอข้อเดิม</p>'+
      '<div class="mapbar" style="margin-top:14px">'+P.meta.weights.map(function(w,i){ return '<div class="s'+i+'" style="flex:'+w.items+'">'+w.label+' '+w.items+'</div>'; }).join("")+'</div>'+
      '<div class="row" style="margin-top:16px"><button class="btn" id="startmock">เริ่มสอบจำลอง</button></div>'+
      '<div class="trap" style="margin-top:14px"><b>วิธีใช้ให้ได้ผล:</b> ทำให้จบในรอบเดียวโดยไม่เปิดดูเฉลย แล้วค่อยอ่านผลแยกตามส่วนและหัวข้อ เพื่อรู้ว่าต้องกลับไปซ่อมจุดไหน</div>'+
    '</div>'+
    (hist.length ? '<div class="card pad0"><div style="padding:16px 16px 0"><p class="eyebrow">ผลย้อนหลัง</p></div>'+
      '<div class="scroll"><table style="margin-top:8px"><thead><tr><th>วันที่</th><th>คะแนน</th><th>Vocab</th><th>Grammar</th><th>Reading</th><th>เวลา</th></tr></thead><tbody>'+
      hist.map(function(m){ return '<tr><td class="num">'+esc(m.date)+'</td><td class="num"><b>'+m.score+'/'+m.total+'</b></td>'+
        '<td class="num">'+m.by.vocab+'/30</td><td class="num">'+m.by.grammar+'/30</td><td class="num">'+m.by.reading+'/20</td><td class="num">'+esc(m.time)+'</td></tr>'; }).join("")+
      '</tbody></table></div></div>' : '')+
  '</section>';
  document.getElementById("startmock").addEventListener("click", function(){
    var items = buildMock().map(withShuffledChoices);
    run = {items:items, i:0, picks:items.map(function(){ return null; }), mode:"mock", started:Date.now()};
    renderRunner();
  });
}
function fmt(ms){ ms=Math.max(0,ms); var s=Math.floor(ms/1000); return (Math.floor(s/60))+":"+String(s%60).padStart(2,"0"); }
function tick(){
  var el = document.getElementById("clock"); if(!el || !run || run.mode!=="mock") return;
  var left = LIMIT - (Date.now()-run.started);
  el.textContent = fmt(left)+" เหลือ";
  el.dataset.low = left < 5*60*1000 ? "1" : "0";
  if(left<=0){ submitMock(); return; }
  clearTimeout(tick._t); tick._t = setTimeout(tick, 1000);
}
function submitMock(){
  clearTimeout(tick._t);
  var items = run.items, picks = run.picks;
  var by = {vocab:0, grammar:0, reading:0}, tried = {vocab:0, grammar:0, reading:0}, score = 0;
  var topics = {};
  items.forEach(function(x,i){
    var right = picks[i]===x.a;
    if(picks[i]!==null) record(x.id, right);
    tried[x.sec]++;
    if(right){ score++; by[x.sec]++; }
    var t = topics[x.topic] = topics[x.topic] || {ok:0,n:0};
    t.n++; if(right) t.ok++;
  });
  var used = fmt(Date.now()-run.started > LIMIT ? LIMIT : Date.now()-run.started);
  var d = new Date();
  S.mocks.push({date:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
    score:score, total:items.length, by:by, time:used});
  save();
  var wrong = items.filter(function(x,i){ return picks[i]!==x.a; });
  var picksCopy = picks.slice();
  run = null;

  app.innerHTML =
  '<section class="view">'+
    '<div class="card">'+
      '<p class="eyebrow">ผลสอบจำลอง · ใช้เวลา '+used+'</p>'+
      '<h1 style="font-size:2rem;margin-top:6px" class="num">'+score+' / '+items.length+'</h1>'+
      '<p class="lead">คิดเป็น '+Math.round(score/items.length*100)+'% ของข้อสอบ 80 ข้อ</p>'+
      '<div class="grid g3" style="margin-top:16px">'+
        ["vocab","grammar","reading"].map(function(k){ var full = k==="reading"?20:30;
          return '<div><div class="row" style="justify-content:space-between"><b style="font-family:var(--display)">'+secLabel(k)+'</b>'+
            '<span class="num">'+by[k]+'/'+full+'</span></div><div class="meter" style="margin-top:6px"><i style="width:'+Math.round(by[k]/full*100)+'%"></i></div></div>'; }).join("")+
      '</div>'+
      '<div class="row" style="margin-top:16px"><button class="btn" id="remock">สอบจำลองอีกครั้ง</button>'+
        (wrong.length?'<button class="btn ghost" id="fixwrong">ซ่อมข้อที่ผิด '+wrong.length+' ข้อ</button>':'')+'</div>'+
    '</div>'+
    '<div class="card pad0"><div style="padding:16px 16px 0"><p class="eyebrow">แยกตามหัวข้อ</p></div>'+
      '<div class="scroll"><table style="margin-top:8px"><thead><tr><th>หัวข้อ</th><th>ถูก</th><th>สัดส่วน</th></tr></thead><tbody>'+
      Object.keys(topics).sort(function(a,b){ return topics[a].ok/topics[a].n - topics[b].ok/topics[b].n; }).map(function(k){ var t=topics[k];
        var pct=Math.round(t.ok/t.n*100);
        return '<tr><td>'+esc(TOPICS[k]||k)+'</td><td class="num">'+t.ok+'/'+t.n+'</td>'+
          '<td><div class="meter"><i style="width:'+pct+'%;background:'+(pct<60?'var(--bad)':'var(--accent)')+'"></i></div></td></tr>'; }).join("")+
      '</tbody></table></div></div>'+
    (wrong.length ? '<div class="card"><p class="eyebrow">เฉลยข้อที่ผิด</p><div class="grid" style="margin-top:10px">'+
      items.map(function(x,i){ if(picksCopy[i]===x.a) return "";
        return '<div style="border-top:1px solid var(--line);padding-top:10px">'+
          '<div class="qmeta"><span class="num">ข้อ '+(i+1)+'</span><span class="badge">'+secLabel(x.sec)+'</span><span>'+esc(TOPICS[x.topic]||"")+'</span></div>'+
          '<p style="font-weight:500;margin-top:6px">'+esc(x.q)+'</p><p class="lead" style="font-size:.86rem">'+esc(x.th)+'</p>'+
          '<p style="margin-top:6px"><span class="badge" style="background:var(--bad-soft);color:var(--bad)">คุณตอบ</span> '+(picksCopy[i]===null?'ไม่ได้ตอบ':esc(x.c[picksCopy[i]]))+'</p>'+
          '<p><span class="badge" style="background:var(--ok-soft);color:var(--ok)">คำตอบ</span> '+esc(x.c[x.a])+'</p>'+
          '<p class="lead" style="margin-top:6px"><b>เพราะ:</b> '+esc(x.why)+'</p>'+
          '<p class="lead"><b>ตัวลวง:</b> '+esc(x.trap)+'</p>'+
          (x.sec==="reading"?passageHTML(x.topic, x.hl, false):"")+'</div>'; }).join("")+
      '</div></div>' : '')+
  '</section>';
  document.getElementById("remock").addEventListener("click", renderMock);
  var f=document.getElementById("fixwrong"); if(f) f.addEventListener("click", function(){ go("drill"); setTimeout(function(){ startDrill(shuffle(wrong)); },0); });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if(!run) return;
  var k = e.key.toLowerCase();
  var map = {a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3};
  if(k in map){ var b = app.querySelector('[data-opt="'+map[k]+'"]'); if(b && !b.disabled) b.click(); }
  if(k==="arrowright"){ var n=app.querySelector('[data-nav="next"]'); if(n && !n.disabled) n.click(); }
  if(k==="arrowleft"){ var p=app.querySelector('[data-nav="prev"]'); if(p && !p.disabled) p.click(); }
});

go(["home","vocab","grammar","reading","drill","mock"].indexOf(S.tab)>=0 ? S.tab : "home");
})();
